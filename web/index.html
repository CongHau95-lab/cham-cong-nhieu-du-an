<style>
/* Layout idea: navy header band carrying the Central mark; a sticky date + brush palette bar; one card per worker with four slot buttons (sáng, chiều, tăng ca trưa, tăng ca tối). Orange marks what is active. */
:root {
  --bg: #eef0f5; --surface: #ffffff; --surface2: #f5f6fa; --ink: #151c33; --muted: #5b6480;
  --line: #d4d9e6; --line2: #e5e8f0;
  --navy: #233064; --pop: #ee4f27;
  --accent: #233064; --on-accent: #ffffff; --head: #233064; --on-head: #ffffff;
  --ok: #1b8a4c; --warn: #b3600a; --bad: #c2342b; --okbg: #e2f4ea; --warnbg: #fdf0dc; --badbg: #fbe5e2;
  --u-bg-s: 72%; --u-bg-l: 90%; --u-fg-s: 65%; --u-fg-l: 24%; --u-bd-s: 45%; --u-bd-l: 62%; --u-sel-l: 36%;
  --f-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-disp: 'Barlow Condensed', 'Arial Narrow', 'Be Vietnam Pro', system-ui, sans-serif;
  --barh: 0px; --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1424; --surface: #171f36; --surface2: #1c2540; --ink: #e8ecf8; --muted: #9aa5c4;
    --line: #2d3858; --line2: #243050; --accent: #a9b9ff; --on-accent: #0b1330; --head: #0a1022; --on-head: #ffffff;
    --pop: #ff6a42; --ok: #5ccf8d; --warn: #f0a85a; --bad: #ff8d80; --okbg: #14301f; --warnbg: #352612; --badbg: #3a1a18;
    --u-bg-s: 34%; --u-bg-l: 25%; --u-fg-s: 85%; --u-fg-l: 86%; --u-bd-s: 38%; --u-bd-l: 46%; --u-sel-l: 44%;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1424; --surface: #171f36; --surface2: #1c2540; --ink: #e8ecf8; --muted: #9aa5c4;
  --line: #2d3858; --line2: #243050; --accent: #a9b9ff; --on-accent: #0b1330; --head: #0a1022; --on-head: #ffffff;
  --pop: #ff6a42; --ok: #5ccf8d; --warn: #f0a85a; --bad: #ff8d80; --okbg: #14301f; --warnbg: #352612; --badbg: #3a1a18;
  --u-bg-s: 34%; --u-bg-l: 25%; --u-fg-s: 85%; --u-fg-l: 86%; --u-bd-s: 38%; --u-bd-l: 46%; --u-sel-l: 44%;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); -webkit-text-size-adjust: 100%; }
body { min-height: 100%; padding-bottom: env(safe-area-inset-bottom); }
body.modal { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
small { font-size: 11.5px; color: var(--muted); }
.muted { color: var(--muted); }
.grow { flex: 1; }
.pad { padding: 10px 14px; }
.hs { }

/* unit colours: one hue per unit, lightness set per theme */
.u { --ub: hsl(var(--h) var(--u-bg-s) var(--u-bg-l)); --uf: hsl(var(--h) var(--u-fg-s) var(--u-fg-l)); --ubd: hsl(var(--h) var(--u-bd-s) var(--u-bd-l)); --usel: hsl(var(--h) 58% var(--u-sel-l)); }

/* ---------- header ---------- */
.top { background: var(--head); color: var(--on-head); padding-top: env(safe-area-inset-top); border-bottom: 4px solid var(--pop); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right)) 4px max(16px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 12px; }
.logo-badge { flex: none; display: flex; align-items: center; padding: 2px 0; }
.logo { display: block; height: 38px; width: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.brand { min-width: 0; flex: 1; }
.brand p { font-size: 13px; font-weight: 600; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { border: 0; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; white-space: nowrap; background: rgba(255,255,255,.14); color: #fff; }
.pill::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: #6be39b; }
.pill.warn::before { background: #ffc15a; }
.pill.bad::before { background: #ff8a7a; }
.tabs { max-width: 1280px; margin: 0 auto; padding: 0 max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left)); display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; background: none; border: 0; color: rgba(255,255,255,.72); padding: 11px 14px 9px; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab .ts { display: none; }
.tab.on { color: #fff; border-bottom-color: var(--pop); }
main { max-width: 1280px; margin: 0 auto; padding: 0 max(12px, env(safe-area-inset-right)) 90px max(12px, env(safe-area-inset-left)); }

/* ---------- buttons ---------- */
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; min-height: 38px; white-space: nowrap; }
.btn.ghost { background: transparent; }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.sm { padding: 4px 11px; min-height: 30px; font-size: 13px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.ib { width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; display: inline-grid; place-items: center; flex: none; }
.lnk { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- sticky bar ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 10px 0 8px; border-bottom: 1px solid var(--line); margin: 0 -12px; padding-left: 12px; padding-right: 12px; }
.bar.flat { position: static; border: 0; }
.datebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dsel { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 0 12px; min-height: 38px; }
.dsel input { border: 0; background: transparent; font-weight: 700; font-size: 15px; padding: 6px 0; width: 138px; }
.wd { font: 600 17px var(--f-disp); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.wd.sun { color: var(--pop); }
.palette { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.chip { white-space: nowrap; display: inline-flex; align-items: baseline; gap: 6px; min-height: 36px; padding: 5px 13px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); }
.chip b { font: 700 15px var(--f-disp); letter-spacing: .04em; }
.chip i { font: normal 700 12px var(--f-body); opacity: .85; }
.chip.u { background: var(--ub); color: var(--uf); border-color: var(--ubd); }
.chip.static { min-height: 0; padding: 1px 10px; cursor: default; }
.chip.off { background: repeating-linear-gradient(135deg, var(--surface2) 0 5px, var(--line2) 5px 10px); color: var(--muted); }
.chip.on { background: var(--usel); color: #fff; border-color: var(--usel); box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--pop); }
.chip.off.on { background: var(--muted); color: #fff; border-color: var(--muted); }
.hint { margin-top: 9px; font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.hint.on { color: var(--ink); background: var(--warnbg); border-left: 4px solid var(--pop); padding: 6px 10px; border-radius: 8px; }
.stats { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 10px 2px 8px; font-size: 13px; }
.st b { font: 700 18px var(--f-disp); }
.st.warn, .warnx { color: var(--warn); font-weight: 700; }
.tg { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 600; }
.tg.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ---------- daily list ---------- */
.colhead, .r { display: grid; grid-template-columns: minmax(180px, 1.5fr) repeat(4, minmax(92px, 1fr)) 84px; gap: 6px; align-items: center; }
.colhead { position: sticky; top: var(--barh); z-index: 15; background: var(--bg); padding: 6px 12px 6px 16px; font: 600 12px var(--f-body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line2); margin: 0 -12px; padding-left: 28px; padding-right: 24px; }
.colhead span { text-align: center; } .colhead span:first-child { text-align: left; }
.gh { display: flex; align-items: baseline; gap: 12px; padding: 14px 4px 6px; flex-wrap: wrap; }
.gh b { font: 700 17px var(--f-disp); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.gtools { margin-left: auto; display: flex; gap: 6px; align-items: center; font-size: 12px; }
.gtools button { background: var(--pop); color: #fff; border: 0; border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 12px; }
.r { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: var(--r); padding: 6px 10px 6px 10px; margin-bottom: 6px; }
.r.st-ok { border-left-color: var(--ok); }
.r.st-part { border-left-color: var(--warn); background: linear-gradient(90deg, var(--warnbg), var(--surface) 22%); }
.r.st-none { border-left-color: var(--line); }
.dot { display: none; }
.nm { background: none; border: 0; text-align: left; padding: 4px 0; min-width: 0; }
.nmt { display: block; min-width: 0; }
.nmt b { display: block; font-weight: 600; font-size: 15px; line-height: 1.25; }
.nmt small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 48px; padding: 3px 4px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); line-height: 1.15; min-width: 0; }
.cell b { font: 700 16px var(--f-disp); letter-spacing: .04em; }
.cell i { font: normal 700 12px var(--f-body); }

.db { padding: 14px; overflow: auto; display: grid; gap: 14px; align-content: start; }
.df { display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line2); background: var(--surface2); }

.ubs { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 7px; }

.ub b { font: 700 16px var(--f-disp); letter-spacing: .04em; }

/* ---------- report ---------- */
.rangebar { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; padding: 4px 0 12px; font-size: 13px; }

/* ---------- toast ---------- */

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const monthOf = s => s.slice(0, 7);
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };

function permsOf(m, project) {
  const z = { role: 'pending', glob: false, in: false, att: 0, workers: 0, cats: 0, set: 0, pay: 0, cost: 0, users: 0, proj: 0, slip: 0, stopped: false, chat: 0, chatM: 0, reqTo: [], reqAll: false, reqGet: false };

  const inP = glob || (!project ? (m.projects || []).length > 0 : (m.projects || []).includes(project.id));
  const stopped = !!(project && project.status === 'stopped') && !glob;
  const P = { ...z, role, glob, in: inP, stopped };
  if (role === 'worker') { P.slip = inP ? 1 : 0; return P; }
  if (!inP) return P;
  const cap = k => stopped && c[k] === 2 ? 1 : c[k];
  P.att = cap('att'); P.workers = cap('workers'); P.cats = cap('cats'); P.set = cap('set'); P.pay = cap('pay');
  if (!P.pay && m.seePay) P.pay = 1;

/** tổng hợp theo hạng mục trong khoảng ngày: công, giờ tăng ca, số người, chi phí (nếu được xem lương).

    try { return parseDoc(await http('GET', `${FS}/${path}`)); }
    catch (e) { if (e.code === 'not-found') return null; throw e; }
  }
  const flt = (field, op, value) => ({ fieldFilter: { field: { fieldPath: field }, op, value } });
  /** parent: '' (gốc) hoặc 'projects/xyz' */
  async function query(parent, col, where, o = {}) {

    return { docs, readMs: rt ? Date.parse(rt) : Date.now() };
  }

  /* ---------- tài khoản và dự án (cấp gốc) ---------- */
  async function projectsList() {
    if (!me) return [];
    if (ROLE_GLOBAL.includes(me.role)) { const r = await query('', 'projects'); return r.docs.filter(d => !d.del).map(d => ({ id: d.id, ...d.data })); }

  }
  async function projectSave(id, data) { await commit([wSet('projects/' + id, data)], false); }
  async function projectPatch(id, patch) { await commit([wMask('projects/' + id, patch)], false); }
  const PROJECT_COLS = ['cats', 'workers', 'wpriv', 'days', 'config', 'cpriv', 'meta', 'payroll', 'slips', 'costs', 'members', 'chat', 'chatm', 'reqs'];
  async function projectRemove(id) {
    for (const col of PROJECT_COLS) {

  }
  async function usersList() {
    const r = await query('', 'users');

      .sort((a, b) => (ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role)) || (!!b.primary - !!a.primary) || String(a.email).localeCompare(String(b.email)));
  }
  const userPatch = (uid, patch) => commit([wMask('users/' + uid, patch, false)], false);
  const userDelete = uid => http('POST', `${FS}:commit`, { writes: [{ delete: dn('users/' + uid) }] });
  /** tự xóa tài khoản của mình (cần nhập lại mật khẩu để Firebase cho phép xóa): xóa hồ sơ rồi xóa tài khoản đăng nhập.
   *  tài khoản gốc vẫn được giữ theo email trong admin/primary: đăng ký lại bằng đúng email này sẽ lấy lại quyền Chủ. */
  async function deleteSelf(password) {

    setSess(j, email);
    await userDelete(sess.uid);
    await authCall('delete', { idToken: sess.idToken });
    signOut();
  }
  /** danh sách công nhân (tên, chức vụ) của một dự án, để gắn tài khoản công nhân với hồ sơ của họ */
  async function workersOf(id) {
    const r = await query('projects/' + id, 'workers');
    return r.docs.filter(d => !d.del).map(d => ({ id: d.id, name: d.data.name || '', pos: d.data.pos || '' })).sort((a, b) => String(a.name).localeCompare(String(b.name), 'vi'));
  }
  /** đã có Chủ chưa (cờ công khai admin/state); tài khoản gốc nằm ở admin/primary, chỉ Chủ đọc được */
  async function ownerExists() { try { return !!(await getDoc('admin/state')); } catch (e) { return true; } }
  async function claimOwner() {
    await commit([wSet('admin/primary', { email: sess.email.toLowerCase(), uid: sess.uid }, false), wSet('admin/state', { claimed: true }, false), wMask('users/' + sess.uid, { role: 'owner', primary: true }, false)], false);
    await loadMe();
  }
  /** tài khoản Chủ từ bản cũ chưa có tài khoản gốc: ghi nhận ngay email của mình làm tài khoản gốc */
  async function ensurePrimary() {
    if (!me || me.role !== 'owner' || me.primary || !me.verified) return;
    if (await ownerExists()) return;
    try { await claimOwner(); } catch (e) { /* để lần sau */ }
  }

  /* ---------- dữ liệu một dự án: bộ nhớ đệm ---------- */
  const store = { cats: {}, workers: {}, wpriv: {}, days: {}, config: {}, cpriv: {}, payroll: {}, slips: {}, costs: {}, members: {}, chat: {}, chatm: {}, reqs: {} };
  let P = permsOf(null, null);
  const cursor = {}, fresh = {}, denied = {}, monthWatch = {}, inflight = {};
  const live = d => d && !d.del;
  const tsMs = s => (s ? Date.parse(s) : 0);
  const canPriv = () => P.pay >= 1;
  const canEdit = () => P.set === 2;           // quản lý dự án
  const setPerms = p => { P = p; };
  const once = (key, fn) => inflight[key] || (inflight[key] = fn().finally(() => { delete inflight[key]; }));
  function put(col, d) {
    const old = store[col][d.id];
    if (old && old.ts && d.ts && tsMs(d.ts) < tsMs(old.ts)) return false;
    store[col][d.id] = d; return true;
  }
  const FULL = () => (P.att ? ['cats', 'workers', 'config'] : []).concat(P.pay ? ['wpriv', 'cpriv', 'payroll', 'slips', 'costs'] : [], !P.pay && P.cost ? ['costs'] : [], P.slip && !P.pay ? ['slips'] : []);
  const loadFull = (col, force) => once('f:' + col, async () => {
    if (denied[col] || (fresh[col] && !force)) return;
    try {
      const mineOnly = col === 'slips' && !P.pay;      // công nhân: chỉ phiếu lương của chính mình
      const r = mineOnly ? await query('projects/' + pid, col, { compositeFilter: { op: 'AND', filters: [flt('wid', 'EQUAL', { stringValue: (me && me.workerId) || '-' }), flt('pub', 'EQUAL', { booleanValue: true })] } }) : await query('projects/' + pid, col), keep = {};
      r.docs.forEach(d => { put(col, d); keep[d.id] = 1; });
      for (const id in store[col]) if (!keep[id] && !store[col][id].local) delete store[col][id];
      cursor[col] = r.readMs; fresh[col] = true;
    } catch (e) {
      if (e.code === 'permission-denied' && ['wpriv', 'cpriv', 'payroll', 'slips', 'costs'].includes(col)) { denied[col] = true; return; }
      throw e;
    }
  });
  const loadMonth = (ym, force) => once('m:' + ym, async () => {
    if (fresh['days:' + ym] && !force) return;
    const r = await query('projects/' + pid, 'days', flt('month', 'EQUAL', { stringValue: ym })), keep = {};
    r.docs.forEach(d => { put('days', d); keep[d.id] = 1; });
    for (const id in store.days) { const x = store.days[id]; if (x.data && x.data.month === ym && !keep[id] && !x.local) delete store.days[id]; }
    if (!cursor.days) cursor.days = r.readMs;

  });
  async function sync() {
    const changed = new Set();
    const cols = FULL().concat(Object.keys(monthWatch).length && P.att ? ['days'] : []);
    for (const col of cols) {
      if (col === 'slips' && !P.pay) { fresh.slips = false; await loadFull('slips', true); changed.add('slips'); continue; }
      if (!cursor[col] || denied[col]) continue;
      const since = new Date(cursor[col] - 3000).toISOString();
      const r = await query('projects/' + pid, col, flt('_ts', 'GREATER_THAN_OR_EQUAL', { timestampValue: since }));
      let any = false; r.docs.forEach(d => { if (put(col, d)) any = true; });
      cursor[col] = r.readMs; if (any) changed.add(col);
    }
    return changed;
  }
  async function openProject(id) {
    closeProject();
    pid = id; try { localStorage.setItem(LS_LAST, id); } catch (e) { /* ignore */ }
    for (const c in store) store[c] = {};
    for (const k of [cursor, fresh, denied, monthWatch]) for (const c in k) delete k[c];
    lastRev = null;
    await Promise.all(FULL().map(c => loadFull(c)));
    startPolling();
    commOpen(id);
  }
  function closeProject() { stopPolling(); commClose(); pid = null; }
  async function watchMonth(ym) {
    if (!pid || monthWatch[ym]) return;
    monthWatch[ym] = 1;
    try { await loadMonth(ym); on.change(['days']); } catch (e) { on.error(e); }
  }

  /* ---------- vòng hỏi + kênh đẩy ---------- */
  let timer = 0, busy = false, down = false, lastRev = null, started = false;
  let stream = null, streamOk = false, streamRetry = 0, backoff = 2000, lastPush, lastOwn = 0, lastKick = 0, kickT = 0, pendingKick = false, tickErr = null;
  function schedule(first) { clearTimeout(timer); if (!started || (typeof document !== 'undefined' && document.hidden)) return; timer = setTimeout(tick, first ? 1500 : (streamOk ? Math.max(POLL_MS, 30000) : POLL_MS)); }
  function visHandler() { if (document.hidden) closeStream(); else { tick(); openStream(); } }   // trao đổi: xem commVis
  const onlineHandler = () => { tick(); openStream(); };
  function startPolling() {
    if (started) return; started = true;

  }
  function stopPolling() {

    streamOk = false; lastPush = undefined;
  }
  async function pushRev() {
    if (!RT || !sess || !pid) return;
    try {
      await ensureToken();
      const v = Date.now(); lastOwn = v;
      await fetch(`${RT}/rev/${encodeURIComponent(pid)}.json?auth=${encodeURIComponent(sess.idToken)}`, { method: 'PUT', body: JSON.stringify(v) });
    } catch (e) { /* kênh đẩy chỉ là phần thêm */ }
  }
  function kick() {
    if (kickT) return;

  }
  function onPush(ev, raw) {

    const v = d.data;

  }
  async function openStream() {

        let i;

    } catch (e) { /* rớt mạng hoặc bị ngắt */ }

  }
  function closeStream() { clearTimeout(streamRetry); if (stream) stream.abort(); }
  async function getRev() {
    try { const j = await http('GET', `${FS}/projects/${pid}/meta/rev`); return j.updateTime || ''; }
    catch (e) { if (e.code === 'not-found') return ''; throw e; }
  }
  async function tick(force) {
    if (busy || !pid) return;
    busy = true;
    try {
      if (sess && Date.now() - lastMeAt > 60000) { const before = meSig(me); await loadMe(); if (me && before !== meSig(me)) { on.auth(); } }
      const rev = await getRev();
      if (force || down || rev !== lastRev) {
        const ch = await sync();
        lastRev = rev;
        if (ch.size) on.change([...ch]);

    } catch (e) {
      if (!down) { down = true; on.error(e); }
    } finally { busy = false; if (pendingKick) { pendingKick = false; kick(); } schedule(); }
  }

  /* ---------- ghi dữ liệu dự án (cập nhật bản đệm ngay, rồi gửi đi) ---------- */
  function localPut(col, id, data, merge) {
    const old = store[col][id];
    let d;
    if (merge) {
      d = old && !old.del ? JSON.parse(JSON.stringify(old.data)) : {};
      for (const k in data) d[k] = (data[k] && typeof data[k] === 'object' && !Array.isArray(data[k]) && d[k] && typeof d[k] === 'object') ? { ...d[k], ...data[k] } : data[k];
    } else d = JSON.parse(JSON.stringify(data));
    store[col][id] = { id, data: d, ts: null, local: true };
  }
  /** ghi cả tài liệu */
  async function setDoc(col, id, data) {
    await commit([wSet(pp(col, id), data)], true);
    localPut(col, id, data, false); on.change([col]);
  }
  /** chỉ ghi đúng các khóa đã đổi (mức 1 cấp lồng nhau) */
  async function patchDoc(col, id, data) {
    await commit([wNested(pp(col, id), data)], true);
    localPut(col, id, data, true); on.change([col]);
  }
  async function delDoc(col, id) {
    await commit([wSet(pp(col, id), { _del: true })], true);
    store[col][id] = { id, data: {}, ts: null, local: true, del: true }; on.change([col]);
  }
  /** lưu công nhân: phần công khai luôn ghi; phần riêng chỉ ghi khi được quyền xem lương */
  async function setWorker(id, data) {
    const [pub, pri] = splitBy(data, WORKER_PRIV_SET), ws = [wSet(pp('workers', id), pub)];
    if (canPriv()) ws.push(wSet(pp('wpriv', id), pri));
    await commit(ws, true);
    localPut('workers', id, pub, false); if (canPriv()) localPut('wpriv', id, pri, false);
    on.change(canPriv() ? ['workers', 'wpriv'] : ['workers']);
  }
  async function setWorkers(items, pubOnly) {     // nhiều người một lần (nhập từ file)
    const ws = [], loc = [];
    items.forEach(({ id, data }) => {
      const [pub, pri] = splitBy(data, WORKER_PRIV_SET);
      ws.push(wSet(pp('workers', id), pub)); loc.push(['workers', id, pub]);
      if (canPriv() && !pubOnly) { ws.push(wSet(pp('wpriv', id), pri)); loc.push(['wpriv', id, pri]); }
    });
    for (let i = 0; i < ws.length; i += 100) await commit(ws.slice(i, i + 100), i + 100 >= ws.length);
    loc.forEach(([c, i, d]) => localPut(c, i, d, false)); on.change(['workers', 'wpriv']);
  }
  async function delWorker(id) {
    const ws = [wSet(pp('workers', id), { _del: true })];
    if (canPriv()) ws.push(wSet(pp('wpriv', id), { _del: true }));
    await commit(ws, true);
    ['workers', 'wpriv'].forEach(c => { store[c][id] = { id, data: {}, ts: null, local: true, del: true }; });
    on.change(['workers', 'wpriv']);
  }

  /* ---------- trao đổi nội bộ, yêu cầu, thông báo ---------- */
  const CHAT_COL = { all: 'chat', mgmt: 'chatm' };
  const NOTIF_MAX = 60, noop = () => {};
  const inbox = { docs: {}, cursor: 0, loaded: false };
  const own = {}, lastAt = { inbox: 0, chat: 0, reqs: 0 };      // own: số "chuông báo" do chính máy này gửi (không tự giật mình)
  const commOn = () => !!(sess && me && me.verified && ROLE_STAFF.includes(me.role));
  const commHidden = () => typeof document !== 'undefined' && document.hidden;
  async function ping(key) {
    if (!RT || !sess) return;
    try {
      await ensureToken();
      const v = Date.now(); own[key] = v;
      await fetch(`${RT}/rev/${encodeURIComponent(key)}.json?auth=${encodeURIComponent(sess.idToken)}`, { method: 'PUT', body: JSON.stringify(v) });

  }

      let seen = Date.now(); const dog = setInterval(() => { if (Date.now() - seen > 70000) c.abort(); }, 10000);
      try {
        const res = await fetch(`${RT}/rev/${encodeURIComponent(mine)}.json`, { headers: { Accept: 'text/event-stream' }, cache: 'no-store', signal: c.signal });
        if (!res.ok || !res.body) throw new Error('stream ' + res.status);

        for (;;) {

    inboxPing.resume(); chatPing.resume();

  }
  /** đăng nhập xong hoặc quyền đổi: bật / tắt hộp thông báo */
  function commSync() {
    if (!commOn()) { commStop(); return; }
    if (!commVisOn && typeof document !== 'undefined') { commVisOn = true; document.addEventListener('visibilitychange', commVis); }
    inboxPing.start('inbox-' + sess.uid);

  /** hỏi định kỳ: dự phòng khi kênh tức thì chưa nối được (hoặc lỡ một "chuông báo") */

    if (!commOn()) return;

    if (now - lastAt.reqs >= 90000) { try { await reqLoad(); on.comm('reqs'); } catch (e) { /* lần sau */ } }
  }

  const mineP = id => id === pid;
  async function loadMembers() {
    const mine = pid, r = await query('projects/' + mine, 'members');
    if (!mineP(mine)) return;
    const keep = {};
    r.docs.forEach(d => { put('members', d); keep[d.id] = 1; });
    for (const id in store.members) if (!keep[id] && !store.members[id].local) delete store.members[id];
    on.comm('members');
  }
  async function loadChat(col) {
    const mine = pid, r = await query('projects/' + mine, col, null, { order: '_ts', dir: 'DESCENDING', limit: 150 });
    if (!mineP(mine)) return;
    const keep = {};
    r.docs.forEach(d => { put(col, d); keep[d.id] = 1; });
    for (const id in store[col]) if (!keep[id] && !store[col][id].local) delete store[col][id];

function authErr(e) {

  if (/EMAIL_EXISTS/.test(m)) return 'Email này đã có tài khoản. Hãy chuyển sang Đăng nhập.';
  if (/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m)) return 'Email hoặc mật khẩu chưa đúng.';
  if (/WEAK_PASSWORD/.test(m)) return 'Mật khẩu quá yếu: cần ít nhất 8 ký tự.';
  if (/INVALID_EMAIL|MISSING_EMAIL/.test(m)) return 'Email chưa hợp lệ.';
  if (/TOO_MANY_ATTEMPTS/.test(m)) return 'Thử quá nhiều lần. Chờ vài phút rồi thử lại.';
  if (/USER_DISABLED/.test(m)) return 'Tài khoản này đã bị khóa.';
  if (/OPERATION_NOT_ALLOWED/.test(m)) return 'Firebase chưa bật đăng nhập bằng Email/Mật khẩu.';
  if (e && e.code === 'unavailable') return 'Không kết nối được mạng.';
  if (e && e.code === 'permission-denied') return 'Máy chủ từ chối. Bạn chưa có quyền làm việc này (hoặc kiểm tra lại Firestore Rules).';
  return 'Không thực hiện được' + (m ? ' (' + m + ')' : '') + '.';
}

/* ================= minimal XLSX writer: ZIP "store" + SpreadsheetML, no external library ================= */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
const utf8 = s => new TextEncoder().encode(s);

function zipStore(files) {
  const out = [], cen = [];
  let off = 0;
  const u16 = v => [v & 255, (v >> 8) & 255], u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  const DT = (46 << 9) | (1 << 5) | 1;   // 2026-01-01 00:00 (DOS date/time)
  for (const f of files) {
    const name = utf8(f.name), data = f.data, crc = crc32(data);
    const lh = Uint8Array.from([0x50, 0x4B, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(DT), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0)]);
    out.push(lh, name, data);
    cen.push(Uint8Array.from([0x50, 0x4B, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(DT), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), name);
    off += lh.length + name.length + data.length;
  }
  const cenLen = cen.reduce((a, c) => a + c.length, 0);
  const end = Uint8Array.from([0x50, 0x4B, 5, 6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cenLen), ...u32(off), ...u16(0)]);
  const all = [...out, ...cen, end];
  const buf = new Uint8Array(all.reduce((a, c) => a + c.length, 0));
  let p = 0; all.forEach(c => { buf.set(c, p); p += c.length; });
  return buf;
}

    if (workerActive(w, from) || workerActive(w, to) || (w.start ? w.start <= to : true) && (!wEnd(w) || wEnd(w) >= from)) return true;
    return payFor(w, from, to).days > 0;
  });
}

/* ---- bảng BCC theo mẫu: ngày × (HC, TC), cuối bảng là công, lương, ngân hàng ---- */
function buildBcc(from, to, withPay, opt = {}) {
  const bk = new XBook({ n: 'Times New Roman', sz: 11 }), st = S.settings, dates = dateRows(from, to), nD = dates.length;
  const sh = bk.sheet((opt.sheet || 'BCC') + ' ' + from.slice(5).split('-').reverse().join('-') + ' đến ' + to.slice(5).split('-').reverse().join('-'), { zoom: 90 });
  const people = peopleFor(from, to), otH = +st.otHours > 0 ? +st.otHours : 8, otF = +st.otFactor > 0 ? +st.otFactor : 1.5;
  const pays = withPay ? people.map(w => payFor(w, from, to)) : [];
  const anyAdj = withPay && pays.some(p => Math.abs(p.total - stdPay(p)) > 0.5);
  // cột
  const cD0 = 4, cDn = 3 + 2 * nD, cCong = cDn + 1, cOt = cDn + 2, cEq = cDn + 3;
  let c = cEq; const cMon = withPay ? ++c : 0, cRate = withPay ? ++c : 0, cMeal = withPay ? ++c : 0, cHouse = withPay ? ++c : 0, cAdj = anyAdj ? ++c : 0, cTotal = withPay ? ++c : 0, cBank = withPay ? ++c : 0, cAcc = withPay ? ++c : 0, cId = withPay ? ++c : 0, cNote = anyAdj ? ++c : 0;
  const last = c, hw = Math.min(last, 22);
  sh.col(1, 1, 5.5); sh.col(2, 2, 28); sh.col(3, 3, 15); dates.forEach((d, i) => sh.col(cD0 + 2 * i, cD0 + 2 * i + 1, wdOf(d) === 0 ? 6.8 : 5.4)); sh.col(cCong, cEq, 10.5);
  if (withPay) { sh.col(cMon, cMon, 14); sh.col(cRate, cRate, 12); sh.col(cMeal, cMeal, 11); sh.col(cHouse, cHouse, 12); if (cAdj) sh.col(cAdj, cAdj, 13); sh.col(cTotal, cTotal, 15); sh.col(cBank, cBank, 13); sh.col(cAcc, cAcc, 17); sh.col(cId, cId, 17); if (cNote) sh.col(cNote, cNote, 40); }
  // đầu phiếu: logo, tiêu đề, kỳ, dự án (bảng bắt đầu ở hàng 8)
  xkHead(bk, sh, { last: hw, title: opt.title || st.formTitle || 'BẢNG TỔNG HỢP CHẤM CÔNG CÔNG NHẬT', lines: [`Từ ngày ${dmy(from)} đến ngày ${dmy(to)}`] });
  const sInfo = bk.style({ font: { sz: 11 }, h: 'left', v: 'center', indent: 1, wrap: true });
  sh.merge(5, 1, 5, hw, 'Dự án: ' + (st.projectFull || (S.project && S.project.name) || ''), sInfo);
  sh.merge(6, 1, 6, hw, 'Gói thầu: ' + (st.package || '') + (st.company ? '     ·     Đội thi công: ' + st.company : ''), sInfo);
  sh.height(5, 18); sh.height(6, 18); sh.height(7, 8);
  // tiêu đề bảng (hàng 8–10)
  const H = (sun, nf) => xs(bk, 'h', { sun: sun ? 1 : 0, nf });
  sh.merge(8, 1, 10, 1, 'TT', H()); sh.merge(8, 2, 10, 2, 'Họ và tên', H()); sh.merge(8, 3, 10, 3, 'Chức vụ', H());
  dates.forEach((d, i) => {
    const a = cD0 + 2 * i, sun = wdOf(d) === 0;
    sh.merge(8, a, 8, a + 1, xlDate(d), H(sun, 'dd/mm'));
    sh.merge(9, a, 9, a + 1, WD_S[wdOf(d)], H(sun));
    sh.set(10, a, sun ? 'HCCN' : 'HC', { s: H(sun) }); sh.set(10, a + 1, sun ? 'TCCN' : 'TC', { s: H(sun) });
  });
  const hd = (col, t) => sh.merge(8, col, 10, col, t, H());
  hd(cCong, 'Tổng ca\n(công)'); hd(cOt, 'Tăng ca\n(giờ)'); hd(cEq, 'Cộng ngày công\n(công)');
  if (withPay) { hd(cMon, 'Lương/\ntháng'); hd(cRate, 'Lương/\nngày'); hd(cMeal, 'Tiền cơm\n(đ/công)'); hd(cHouse, 'Tiền hỗ trợ\nnhà trọ'); if (cAdj) hd(cAdj, 'Điều chỉnh'); hd(cTotal, 'Thành tiền'); hd(cBank, 'Ngân hàng'); hd(cAcc, 'Số tài khoản'); hd(cId, 'Số CCCD'); if (cNote) hd(cNote, 'Ghi chú điều chỉnh'); }
  sh.height(8, 22); sh.height(9, 18); sh.height(10, 18);
  // dữ liệu
  const r0 = 11, totals = { cong: 0, ot: 0, eq: 0, total: 0 }, colTot = {};
  people.forEach((w, i) => {
    const r = r0 + i, z = i % 2 === 1, p = withPay ? pays[i] : payFor(w, from, to);
    sh.set(r, 1, i + 1, { s: xs(bk, 'c', { z }) }); sh.set(r, 2, w.name, { s: xs(bk, 't', { z, b: 1 }) }); sh.set(r, 3, w.pos || '', { s: xs(bk, 't', { z }) });
    dates.forEach((d, k) => {
      const a = cD0 + 2 * k, row = getRow(d, w.id), inf = rowInfo(row), sun = wdOf(d) === 0, sC = xs(bk, 'cd', { z, sun: sun ? 1 : 0 });
      let hc = null; if (inf.cong > 0) hc = inf.cong; else if (row.s === 'X' || row.c === 'X') hc = 'X';
      sh.set(r, a, hc, { s: sC }); sh.set(r, a + 1, inf.ot > 0 ? inf.ot : null, { s: sC });
      if (typeof hc === 'number') colTot[a] = (colTot[a] || 0) + hc; if (inf.ot) colTot[a + 1] = (colTot[a + 1] || 0) + inf.ot;
    });
    const rng = (a, b) => `${cellRef(r, a)}:${cellRef(r, b)}`, hdr = `$${colName(cD0)}$10:$${colName(cDn)}$10`;
    sh.set(r, cCong, p.cong, { s: xs(bk, 'd', { z, b: 1 }), f: `SUMIF(${hdr},"HC*",${rng(cD0, cDn)})` });
    sh.set(r, cOt, p.ot, { s: xs(bk, 'd', { z }), f: `SUMIF(${hdr},"TC*",${rng(cD0, cDn)})` });
    sh.set(r, cEq, round1(p.cong + p.ot / otH * otF), { s: xs(bk, 'd', { z, b: 1 }), f: `ROUND(${cellRef(r, cCong)}+${cellRef(r, cOt)}/${otH}*${otF},1)` });
    totals.cong += p.cong; totals.ot += p.ot; totals.eq += round1(p.cong + p.ot / otH * otF);
    if (withPay) {
      const M = xs(bk, 'n', { z });
      sh.set(r, cMon, p.monthly, { s: M });
      sh.set(r, cRate, p.rate, { s: M, f: `${cellRef(r, cMon)}/${divisor()}` });
      sh.set(r, cMeal, p.mealRate, { s: M }); sh.set(r, cHouse, p.housing, { s: M });
      const std = stdPay(p), diff = Math.round(p.total - std);
      if (cAdj) sh.set(r, cAdj, diff, { s: M });
      sh.set(r, cTotal, p.total, { s: xs(bk, 'n', { z, b: 1 }), f: `${cellRef(r, cEq)}*${cellRef(r, cRate)}+${cellRef(r, cHouse)}+${cellRef(r, cMeal)}*${cellRef(r, cCong)}${cAdj ? '+' + cellRef(r, cAdj) : ''}` });
      totals.total += p.total;
      sh.set(r, cBank, w.bank || '', { s: xs(bk, 'c', { z }) }); sh.set(r, cAcc, w.account || '', { s: xs(bk, 'c', { z }) }); sh.set(r, cId, w.cccd || '', { s: xs(bk, 'c', { z }) });
      if (cNote) {
        const notes = [];
        if (p.changed) p.segs.forEach(sg => notes.push(`${dmy(sg.from)}–${dmy(sg.to)}: ${vnd(num(sg.rec && sg.rec.monthly))}/tháng`));
        p.adjList.forEach(a => notes.push(`${dmy(a.date)}: ${num(a.amt) >= 0 ? '+' : '−'}${vnd(Math.abs(num(a.amt)))}${a.note ? ' (' + a.note + ')' : ''}`));
        sh.set(r, cNote, notes.join('; '), { s: xs(bk, 't', { z, wrap: 1 }) });
      }
    }
  });
  const rT = r0 + people.length, T = o => xs(bk, o || 't', { tot: 1 });
  sh.merge(rT, 1, rT, 3, 'Tổng cộng', T());
  for (let a = cD0; a <= cDn; a++) sh.set(rT, a, colTot[a] || 0, { s: xs(bk, 'cd', { tot: 1 }), f: `SUBTOTAL(9,${cellRef(r0, a)}:${cellRef(Math.max(rT - 1, r0), a)})` });
  const sumf = (col, v, k) => sh.set(rT, col, v, { s: T(k), f: `SUBTOTAL(9,${cellRef(r0, col)}:${cellRef(Math.max(rT - 1, r0), col)})` });
  sumf(cCong, totals.cong, 'd'); sumf(cOt, totals.ot, 'd'); sumf(cEq, totals.eq, 'd');
  if (withPay) { for (let k = cMon; k <= cId + (cNote ? 1 : 0); k++) sh.set(rT, k, null, { s: T() }); if (cAdj) sumf(cAdj, Math.round(pays.reduce((a, p) => a + (p.total - stdPay(p)), 0)), 'n'); sumf(cTotal, totals.total, 'n'); }
  sh.height(rT, 22);
  // ghi chú và người ký
  let r = rT + 2;
  const notes = opt.noNotes ? [] : String(st.notes || '').split('\n').map(x => x.trim()).filter(Boolean);
  if (notes.length) { sh.merge(r, 1, r, hw, 'Ghi chú:', bk.style({ font: { b: 1, sz: 11 }, h: 'left', indent: 1 })); r = xkNotes(bk, sh, r + 1, Math.min(hw, cEq), notes, { width: 150 }); }
  const sg = opt.signers || String(st.signers || '').split(';').map(x => x.trim()).filter(Boolean);
  r = xkSign(bk, sh, r + 1, Math.min(cEq, Math.max(hw, sg.length * 4)), sg, { date: 'Ngày ….. tháng ….. năm …..' });
  sh.freeze = { rows: 10, cols: 3 };
  xkPage(sh, { orient: 'landscape', fitH: 0, left: xkWho(), titles: '$8:$10' });
  return bk.build();
}
/** thành tiền theo công thức chuẩn của mẫu (mức lương cuối kỳ cho cả kỳ) */
function stdPay(p) { const st = S.settings, otH = +st.otHours > 0 ? +st.otHours : 8, otF = +st.otFactor > 0 ? +st.otFactor : 1.5; return round1(p.cong + p.ot / otH * otF) * p.rate + p.housing + p.mealRate * p.cong; }

function buildCatsXlsx(from, to) {

  const rows = list.map(c => ({ c, b: rep.by[c.id] || { cong: 0, ot: 0, people: new Set(), cost: 0, acong: 0 } })), tc = rows.reduce((a, x) => a + x.b.cost, 0);
  const cols = [
    { h: 'TT', w: 6, k: 'c', v: (x, i) => i + 1 }, { h: 'Hạng mục', w: 32, k: 't', b: 1, v: x => x.c.name },
    { h: 'Công', w: 13, k: 'd', v: x => Math.round(x.b.cong * 100) / 100, t: 'sum' }, { h: 'Tăng ca (giờ)', w: 14, k: 'd', v: x => Math.round(x.b.ot * 100) / 100, t: 'sum' },
    { h: 'Trong đó công phân bổ', w: 16, k: 'd', v: x => Math.round(x.b.acong * 100) / 100, t: 'sum' }, { h: 'Số người', w: 11, k: 'n', v: x => x.b.people.size }];
  const hr = 6, rT = hr + 1 + Math.max(rows.length, 1);

  const last = cols.length;
  xkHead(bk, sh, { last, title: 'TỔNG HỢP THEO HẠNG MỤC', lines: [xkProj(), `Từ ngày ${dmy(from)} đến ngày ${dmy(to)}`] });
  const t = xkTable(bk, sh, hr, cols, rows, { span: 2, hh: 36 });

  xkSign(bk, sh, r + 1, last, ['Người lập biểu', 'Chỉ huy trưởng công trường'], { date: 'Ngày ….. tháng ….. năm …..' });
  sh.freeze = { rows: t.hr, cols: 2 }; xkPage(sh, { orient: 'portrait', fitH: 0, left: xkWho(), titles: `$${t.hr}:$${t.hr}` });
  return bk.build();
}

async function buildBackup() {

  const workers = {}; Object.values(S.workers).forEach(w => { const o = { ...w }; delete o.id; workers[w.id] = o; });

}

async function restoreBackup(j) {
  if (!S.canWorkers || !S.canSet) throw new Error('bạn chưa có quyền nạp dữ liệu vào dự án này');
  if (!j || typeof j !== 'object' || (!j.workers && !j.cats && !j.days)) throw new Error('không thấy dữ liệu công nhân/hạng mục');
  const out = [];
  const cats = j.cats || {};
  for (const id of Object.keys(cats)) await S.fb.setDoc('cats', id, { name: cats[id].name || '', note: cats[id].note || '', hue: cats[id].hue ?? '', active: cats[id].active !== false, order: cats[id].order ?? 0 });
  if (Object.keys(cats).length) out.push(`${Object.keys(cats).length} hạng mục`);
  const ws = j.workers || {}, items = Object.keys(ws).map(id => ({ id, data: ws[id] }));
  if (items.length) { await S.fb.setWorkers(items, !j.private); out.push(`${items.length} công nhân`); }
  if (j.settings && S.canSet) { await S.fb.setDoc('config', 'settings', { ...DEFAULT_SETTINGS, ...j.settings }); out.push('cài đặt'); }
  if (j.pay && S.canPay && S.canSet) { await S.fb.setDoc('cpriv', 'pay', { ...DEFAULT_PAY, ...j.pay }); out.push('tiền cơm / nhà trọ'); }
  const dates = Object.keys(j.days || {});
  for (let i = 0; i < dates.length; i += 8) {
    await Promise.all(dates.slice(i, i + 8).map(date => { const d = j.days[date]; return S.fb.patchDoc('days', date, { date, month: monthOf(date), rows: d.rows || {}, jobs: d.jobs || {} }); }));
  }
  if (dates.length) out.push(`${dates.length} ngày chấm công`);
  pull(); render();
  return out.join(', ') || 'không có gì mới';
}

      const tip = [r.s != null ? 'Sáng: ' + (r.s === 'X' ? 'nghỉ' : catName(r.s)) : '', r.c != null ? 'Chiều: ' + (r.c === 'X' ? 'nghỉ' : catName(r.c)) : '', r.tr ? `Trưa ${r.tr.a}–${r.tr.b} (${fmt(r.tr.h)}h) ${catName(r.tr.u)}` : '', r.t ? `Tối ${r.t.a}–${r.t.b} (${fmt(r.t.h)}h) ${catName(r.t.u)}` : '', r.n].filter(Boolean).join(' · ');
      const otU = r.t ? r.t.u : r.tr ? r.tr.u : '';
      cells += `<td class="${cls}"><button type="button" class="mb" data-act="mgo" data-date="${date}" data-wid="${esc(w.id)}" title="${esc(tip)}" aria-label="${esc(w.name)} ngày ${d}: ${esc(tip)}">${half(r.s)}${half(r.c)}${inf.cong ? `<span class="mn">${inf.cong === 1 ? '1' : '½'}</span>` : ''}${inf.ot ? `<span class="mo u" style="${cStyle(otU)}">${fmt(inf.ot)}</span>` : ''}</button></td>`;

  }).join('');
  let foot = '';
  for (let d = 1; d <= n; d++) { const pd = perD[d] || { c: 0, o: 0 }; foot += `<td class="fd">${pd.c ? fmt(pd.c) : ''}${pd.o ? `<small>+${fmt(pd.o)}</small>` : ''}</td>`; }
  const legend = catList().map(c => `<span class="lg">${chipC(c.id)}</span>`).join('');

/* ================= khoảng ngày dùng chung (lương, hạng mục) ================= */
function rangeBar(extra = '') {
  const m = monthOf(today), pm = addMonths(m, -1);
  const cy = cycleOf(today), cp = cycleOf(addDays(cy[0], -1)), all = [['Tháng này', `${m}-01`, today], ['Tháng trước', `${pm}-01`, `${pm}-${pad(daysIn(pm))}`], ['1–15 tháng này', `${m}-01`, `${m}-15`], ['16–cuối tháng trước', `${pm}-16`, `${pm}-${pad(daysIn(pm))}`], ['14 ngày qua', addDays(today, -13), today]];
  if (cycleDay() > 1) all.unshift(['Kỳ lương trước', cp[0], cp[1]], ['Kỳ lương này', cy[0], cy[1]]);
  const chips = all
    .map(([t, a, b]) => `<button type="button" class="tg${S.pFrom === a && S.pTo === b ? ' on' : ''}" data-act="range" data-a="${a}" data-b="${b}">${t}</button>`).join('');
  return `<div class="rangebar"><label>Từ ngày<input type="date" id="pfrom" data-chg="pfrom" value="${S.pFrom}" style="width:auto"></label><label>Đến ngày<input type="date" id="pto" data-chg="pto" value="${S.pTo}" style="width:auto"></label><div class="wfil" style="border:0;padding:0">${chips}</div>${extra}</div>`;
}
function setRange(a, b) { if (!isDate(a) || !isDate(b)) return; if (b < a) b = a; if (daysBetween(a, b) > 400) b = addDays(a, 399); S.pFrom = a; S.pTo = b; render(); }
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
A.range = el => setRange(el.dataset.a, el.dataset.b);
C.pfrom = el => setRange(el.value, S.pTo < el.value ? el.value : S.pTo);
C.pto = el => setRange(S.pFrom, el.value);
function watchRange() { for (let m = monthOf(S.pFrom), n = 0; m <= monthOf(S.pTo) && n < 16; m = addMonths(m, 1), n++) watchMonth(m); }
const periodTxt = () => `${dmy(S.pFrom)} – ${dmy(S.pTo)}`;

/* ================= kỳ lương tùy chỉnh ================= */
const cycleDay = () => clamp(Math.round(+S.settings.cycleDay) || 1, 1, 28);
/** kỳ lương chứa ngày d: từ ngày cycleDay của tháng (trước), đến ngày cycleDay-1 của tháng sau */
function cycleOf(d) {
  const cd = cycleDay(), m = monthOf(d), day = +d.slice(8, 10);
  if (cd === 1) return [`${m}-01`, `${m}-${pad(daysIn(m))}`];
  const start = day >= cd ? `${m}-${pad(cd)}` : `${addMonths(m, -1)}-${pad(cd)}`, sm = monthOf(start), em = addMonths(sm, 1);
  return [start, `${em}-${pad(cd - 1)}`];
}

}

/* ---- nhập danh sách từ Excel (dán) hoặc từ file sao lưu .json ---- */
const IMP_COLS = [['name', 'Họ tên'], ['pos', 'Chức vụ'], ['monthly', 'Lương tháng'], ['bank', 'Ngân hàng'], ['account', 'Số tài khoản'], ['cccd', 'CCCD'], ['start', 'Ngày vào']];
const IMP_KEYS = { name: /^(ho va ten|ho ten|ten|ho va ten cong nhan|cong nhan)$/, pos: /^(chuc vu|vi tri|chuc danh|nghe)/, monthly: /luong/, bank: /ngan hang/, account: /(so tai khoan|stk|tai khoan)/, cccd: /(cccd|can cuoc|cmnd)/, start: /ngay (vao|bat dau)/ };
function parsePaste(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (!lines.length) return { rows: [], map: [] };
  const split = l => l.includes('\t') ? l.split('\t') : l.split(/;|,(?=\S)/);
  const cells = lines.map(split).map(a => a.map(x => x.trim()));
  let map = IMP_COLS.slice(0, Math.min(3, cells[0].length)).map(c => c[0]), start = 0;
  const hdr = cells[0].map(x => fold(x));
  const found = hdr.map(h => Object.keys(IMP_KEYS).find(k => IMP_KEYS[k].test(h)) || '');
  if (found.includes('name')) { map = found; start = 1; }
  const rows = cells.slice(start).map(a => { const o = {}; a.forEach((v, i) => { if (map[i] && v !== '') o[map[i]] = v; }); return o; }).filter(o => o.name);
  return { rows, map };
}

/* ---------- PDF viết tay: nhúng font Liberation Serif (có đủ chữ tiếng Việt) và logo JPEG ---------- */
function pdfFromPages(pageOps, title) {

    const cid = add(`<< /Type /Font /Subtype /CIDFontType2 /BaseFont /${name} /CIDSystemInfo << /Registry (Adobe) /Ordering (Identity) /Supplement 0 >> /FontDescriptor ${desc} 0 R /DW 1000 /W [${W}] /CIDToGIDMap /Identity >>`);
    let cm = '/CIDInit /ProcSet findresource begin\n12 dict begin\nbegincmap\n/CIDSystemInfo << /Registry (Adobe) /Ordering (UCS) /Supplement 0 >> def\n/CMapName /Adobe-Identity-UCS def\n/CMapType 2 def\n1 begincodespacerange\n<0000> <FFFF>\nendcodespacerange\n';
    const hex4 = v => v.toString(16).toUpperCase().padStart(4, '0');
    for (let i = 0; i < byGid.length; i += 100) { const part = byGid.slice(i, i + 100); cm += `${part.length} beginbfchar\n` + part.map(([g, , cp]) => `<${hex4(g)}> <${hex4(cp)}>`).join('\n') + '\nendbfchar\n'; }
    cm += 'endcmap\nCMapName currentdict /CMap defineresource pop\nend\nend';
    const tu = add(...stream('', enc(cm)));
    fontIds[k] = add(`<< /Type /Font /Subtype /Type0 /BaseFont /${name} /Encoding /Identity-H /DescendantFonts [${cid} 0 R] /ToUnicode ${tu} 0 R >>`);
  });
  const jpg = b64bytes(ASSET.payLogo.jpg);
  const img = add(...stream(`/Type /XObject /Subtype /Image /Width ${ASSET.payLogo.w} /Height ${ASSET.payLogo.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode`, jpg));
  const hexText = (s, k) => { const f = ASSET.fonts[k]; let h = ''; for (const ch of s) { const m = f.cmap[ch.codePointAt(0)] || f.cmap[63]; h += (m ? m[0] : 0).toString(16).padStart(4, '0'); } return '<' + h + '>'; };
  const pageIds = [];
  pageOps.forEach(pg => {
    const ops = pg.ops, PWi = pg.w, HW = pg.h / PT;
    let c = '1 J 1 j\n';
    for (const o of ops) {
      if (o.t === 'line') c += `${n2(o.lw / PT)} w ${mm(o.x1)} ${n2(HW - o.y1 / PT)} m ${mm(o.x2)} ${n2(HW - o.y2 / PT)} l S\n`;
      else if (o.t === 'rect') {
        const g = o.fill != null ? `${n2(o.fill)} g ${mm(o.x)} ${n2(HW - (o.y + o.h) / PT)} ${mm(o.w)} ${mm(o.h)} re f 0 g\n` : '';
        c += g + `${n2(o.lw / PT)} w ${mm(o.x)} ${n2(HW - (o.y + o.h) / PT)} ${mm(o.w)} ${mm(o.h)} re S\n`;
      } else if (o.t === 'img') c += `q ${mm(o.w)} 0 0 ${mm(o.h)} ${mm(o.x)} ${n2(HW - (o.y + o.h) / PT)} cm /Im1 Do Q\n`;
      else if (o.t === 'text' && o.s) {
        let x = o.x; if (o.a === 'c') x -= textW(o.s, o.size, o.f) / 2; else if (o.a === 'r') x -= textW(o.s, o.size, o.f);

  put(pagesId, `<< /Type /Pages /Kids [${pageIds.map(i => i + ' 0 R').join(' ')}] /Count ${pageIds.length} >>`);
  const info = add(`<< /Title (${String(title || 'Phieu luong').replace(/[^\x20-\x7e]/g, '').replace(/[()\\]/g, '')}) /Producer (Central SC) >>`);
  const chunks = [enc('%PDF-1.4\n%'), new Uint8Array([0xE2, 0xE3, 0xCF, 0xD3]), enc('\n')];

  chunks.push(enc(x));

  let p = 0; chunks.forEach(c => { out.set(c, p); p += c.length; });
  return out;
}

/* ---- nhập khấu trừ: ghi vào payroll/{từ_đến}, mỗi người một mục ---- */
C.ded = async el => {
  if (!S.canPay) return;
  const wid = el.dataset.wid, k = el.dataset.k, from = S.pFrom, to = S.pTo, id = payrollId(from, to), w = S.workers[wid];
  const cur = dedOf(from, to, wid);
  const ov = { ...cur.ov }, item = { v: 2, other: num(cur.other), note: cur.note || '' };
  if (k === 'note') item.note = el.value.trim();
  else if (k === 'other') item.other = Math.max(0, Math.round(num(el.value)));
  else if (el.value.trim() === '') delete ov[k];
  else { const v = Math.max(0, Math.round(num(el.value))); if (w && v === Math.round(cur.auto[k])) delete ov[k]; else ov[k] = v; }
  item.ov = ov;
  if (await saveDoc(() => S.fb.patchDoc('payroll', id, { from, to, name: slipTitle(from, to), items: { [wid]: item } }))) render();
};
C.si = async el => {
  if (!S.canPay) return;
  const w = S.workers[el.dataset.wid]; if (!w) return;
  const data = { ...w }; delete data.id; data.si = Math.max(0, Math.round(num(el.value)));
  if (await saveDoc(() => S.fb.setWorker(w.id, data))) render();
};
C['ins-on'] = async el => {
  if (!S.canPay) return;
  const from = S.pFrom, to = S.pTo;

A['ded-copy'] = async () => {
  const from = S.pFrom, to = S.pTo;

  if (!prev) { toast('Chưa có kỳ lương trước để chép.'); return; }
  const items = {}; Object.keys(prev.items).forEach(wid => { if (S.workers[wid]) items[wid] = { ...prev.items[wid] }; });
  const insFlag = typeof prev.ins === 'boolean' ? { ins: prev.ins } : {};
  if (await saveDoc(() => S.fb.patchDoc('payroll', payrollId(from, to), { from, to, name: slipTitle(from, to), items, ...insFlag }))) { render(); toast(`Đã chép khấu trừ của kỳ ${dmy(prev.from)} – ${dmy(prev.to)}. Kiểm tra lại từng số.`); }
};

const fileSlug = s => slug(s).slice(0, 40);
async function slipFiles(snaps, f, mode, from, to) {
  const base = `Phieu-luong_${fileBase()}_${from}_${to}`, files = [];
  if (f === 'pdf') {
    if (mode === 'one') return { name: base + '.pdf', data: pdfFromPages(snaps.flatMap(slipPages), 'Phieu luong') };
    snaps.forEach(sn => files.push({ name: `${fileSlug(sn.name)}_${from}_${to}.pdf`, data: pdfFromPages(slipPages(sn), 'Phieu luong') }));
  } else if (f === 'png') {
    for (const sn of snaps) { const pg = slipPages(sn); for (let i = 0; i < pg.length; i++) files.push({ name: `${fileSlug(sn.name)}_${from}_${to}${pg.length > 1 ? '_t' + (i + 1) : ''}.png`, data: await pageToPng(pg[i]) }); }
    if (files.length === 1) return { name: files[0].name, data: files[0].data };
  } else {
    if (mode === 'one') return { name: base + '.xlsx', data: buildSlipsXlsx(snaps) };
    snaps.forEach(sn => files.push({ name: `${fileSlug(sn.name)}_${from}_${to}.xlsx`, data: buildSlipsXlsx([sn]) }));
  }
  if (files.length === 1) return files[0];
  return { name: base + '.zip', data: zipStore(files) };
}
A['slip-go'] = async () => {
  const d = S.dlg, err = $('#sl-err'); if (!d || d.busy) return;
  const list = d.ids.map(id => S.workers[id]).filter(w => w && d.sel[w.id]);
  if (!list.length) { err.textContent = 'Chọn ít nhất một người.'; return; }
  d.busy = true; renderDlg();
  try {
    await monthsReady(d.from, d.to);
    const out = await slipFiles(list.map(w => slipSnap(w, d.from, d.to)), d.fmt, d.mode, d.from, d.to);
    const r = await saveFile(out.name, out.data);
    d.busy = false; renderDlg();
    toast(r === 'declined' ? 'Đã hủy, chưa lưu file.' : `Đã lưu ${out.name}.`);
  } catch (e) { d.busy = false; renderDlg(); const er = $('#sl-err'); if (er) er.textContent = 'Không tạo được phiếu: ' + (e.message || e); }
};

  const cols = [
    cp('TT', 4.5, 'c', (x, i) => i + 1), cp('Họ và tên', 22, 't', x => x.w.name, { b: 1 }), cp('Chức vụ', 16, 't', x => x.w.pos || ''),

    cp('Đơn giá / công', 10.5, 'n', x => R(x.p.rate)), cp('Tiền lương', 12.5, 'n', x => R(x.p.labor), { t: 'sum' }), cp('Tiền cơm', 10.5, 'n', x => R(x.p.meal), { t: 'sum' }), cp('Nhà trọ', 10, 'n', x => R(x.p.housing), { t: 'sum' }), cp('Điều chỉnh', 10, 'n', x => R(x.p.adj), { t: 'sum' }),

/* ================= phân tích chi phí theo hạng mục: biểu đồ trong app + Excel có biểu đồ ================= */
const hslHex = (h, s = 58, l = 44) => {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('').toUpperCase();
};
/** số thực từ bộ nhớ (không qua num(): num hiểu dấu chấm là phân cách nghìn kiểu Việt Nam) */
const nn = v => { const x = +v; return Number.isFinite(x) ? x : 0; };
const catColor = id => id === UNALLOC ? '8A8FA3' : id === ALLOC ? hslHex(285) : hslHex(S.cats[id] ? hueOf(S.cats[id]) : 210);

/* ---------- số liệu: người có quyền lương tính trực tiếp; Kỹ sư đọc bản tổng hợp chi phí do tài khoản có quyền lương cập nhật ---------- */
function analysisData(from, to) {
  if (S.canPrivate) { const r = catReport(from, to, true, true); return { src: 'live', by: r.by, tot: r.tot, days: r.days, at: '' }; }
  const by = {}, days = {}, tot = { cong: 0, ot: 0, cost: 0, acong: 0, aot: 0, acost: 0 }; let at = '';
  eachDate(from, to, d => {
    const doc = S.costs[monthOf(d)], day = doc && doc.days && doc.days[d];
    if (doc && doc.at && doc.at > at) at = doc.at;
    if (!day) return;
    days[d] = day;
    for (const cid in day) {
      const x = day[cid], b = by[cid] || (by[cid] = { id: cid, cong: 0, ot: 0, cost: 0, acong: 0, aot: 0, acost: 0, people: null });
      ['cong', 'ot', 'cost', 'acong', 'aot', 'acost'].forEach(k => { b[k] += nn(x[k]); tot[k] += nn(x[k]); });

async function costSync() {

  const months = [...new Set(Object.keys(S.days).map(monthOf))];
  for (const ym of months) {
    const a = `${ym}-01`, b = `${ym}-${pad(daysIn(ym))}`, r = catReport(a, b, true, true);
    if (!(r.tot.cong || r.tot.ot)) continue;
    const sig = [r.tot.cong, r.tot.ot, r.tot.cost, r.tot.acong, r.tot.acost].map(v => Math.round(v * 100)).join('|') + '|' + Object.keys(r.by).length;
    const cur = S.costs[ym];

    const days = {};
    for (const d in r.days) {
      const o = {}; for (const cid in r.days[d]) { const x = r.days[d][cid]; o[cid] = { cong: Math.round(x.cong * 1000) / 1000, ot: Math.round(x.ot * 1000) / 1000, cost: Math.round(x.cost), acong: Math.round(x.acong * 1000) / 1000, aot: Math.round(x.aot * 1000) / 1000, acost: Math.round(x.acost) }; }

/* ---------- biểu đồ SVG ---------- */
const nfmt = (v, cost) => cost ? vnd(v) : fmt(v);
function svgBars(items, o = {}) {
  if (!items.length) return '<p class="muted pad">Chưa có số liệu trong kỳ này.</p>';
  const W = 680, LW = 150, RW = 92, BH = 22, GAP = 9, H = items.length * (BH + GAP) + 8, max = Math.max(...items.map(x => x.v), 1e-9), BW = W - LW - RW;
  const rows = items.map((x, i) => {
    const y = 4 + i * (BH + GAP), w1 = Math.max(0, (x.v - (x.v2 || 0)) / max * BW), w2 = Math.max(0, (x.v2 || 0) / max * BW), c = '#' + x.color;
    return `<g><text x="${LW - 8}" y="${y + BH / 2 + 4}" text-anchor="end" class="cl">${esc(x.label.length > 20 ? x.label.slice(0, 19) + '…' : x.label)}</text>
      <rect x="${LW}" y="${y}" width="${w1.toFixed(1)}" height="${BH}" rx="3" fill="${c}"/>${w2 > 0 ? `<rect x="${(LW + w1).toFixed(1)}" y="${y}" width="${w2.toFixed(1)}" height="${BH}" rx="3" fill="${c}" opacity=".45"/>` : ''}
      <text x="${(LW + w1 + w2 + 6).toFixed(1)}" y="${y + BH / 2 + 4}" class="cv">${nfmt(x.v, o.cost)}${x.pct != null ? ` · ${x.pct}%` : ''}</text><title>${esc(x.label)}: ${nfmt(x.v, o.cost)}${x.v2 ? ` (trong đó phân bổ ${nfmt(x.v2, o.cost)})` : ''}</title></g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || 'Biểu đồ cột')}">${rows}</svg>`;
}
function svgDays(dates, cats, days, key) {
  const tot = dates.map(d => cats.reduce((a, c) => a + nn(days[d] && days[d][c.id] && days[d][c.id][key]), 0)), max = Math.max(...tot, 1e-9);
  if (!tot.some(v => v > 0)) return '<p class="muted pad">Chưa có số liệu trong kỳ này.</p>';
  const W = 680, H = 210, L = 46, B = 26, T = 8, bw = (W - L - 6) / dates.length, ph = H - B - T;
  let g = '';
  [0, .5, 1].forEach(f => { const y = T + ph * (1 - f); g += `<line x1="${L}" x2="${W - 4}" y1="${y}" y2="${y}" class="cg"/><text x="${L - 5}" y="${y + 4}" text-anchor="end" class="cl">${key === 'cost' ? (max * f >= 1e6 ? fmt(max * f / 1e6) + 'tr' : vnd(max * f)) : fmt(max * f)}</text>`; });
  dates.forEach((d, i) => {
    let y = T + ph; const x = L + i * bw;
    cats.forEach(c => { const v = nn(days[d] && days[d][c.id] && days[d][c.id][key]); if (v <= 0) return; const h = v / max * ph; y -= h; g += `<rect x="${(x + 1).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(bw - 2, 1).toFixed(1)}" height="${h.toFixed(1)}" fill="#${catColor(c.id)}"><title>${dmy(d)} · ${esc(c.name)}: ${nfmt(v, key === 'cost')}</title></rect>`; });
    if (dates.length <= 16 || i % Math.ceil(dates.length / 14) === 0) g += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="cl">${d.slice(8)}/${d.slice(5, 7)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ theo ngày">${g}</svg>`;
}

  const otSec = (slot, title) => {
    const v = r[slot], [wa, wb] = otWin(slot), isTr = slot === 'tr', dv = v || otDefault(slot, '·') || { a: hhmm(wa), b: hhmm(wa + 60) };
    const frame = isTr ? `trong khung ${hhmm(wa)}–${hhmm(wb)}` : `bắt đầu từ ${hhmm(wa)} trở đi (mặc định ${hhmm(otStart('t'))})`;
    const tin = (k, val, loH, hiH, dis) => {
      const m0 = tmin(val), H = m0 == null ? loH : Math.floor(m0 / 60), M = m0 == null ? 0 : m0 % 60, hs = [], ms = [];
      for (let h = loH; h <= hiH; h++) hs.push(h); if (!hs.includes(H)) hs.push(H);
      for (let m = 0; m < 60; m += 5) ms.push(m); if (!ms.includes(M)) ms.push(M); ms.sort((x, y) => x - y);
      return `<span class="tmw"><select class="tm" data-chg="otime" data-slot="${slot}" data-k="${k}" data-p="h" aria-label="${k === 'a' ? 'Từ' : 'Đến'} giờ"${dis ? ' disabled' : ''}>${hs.map(h => `<option value="${pad(h)}"${h === H ? ' selected' : ''}>${pad(h)}</option>`).join('')}</select><b>:</b><select class="tm" data-chg="otime" data-slot="${slot}" data-k="${k}" data-p="m" aria-label="${k === 'a' ? 'Từ' : 'Đến'} phút"${dis ? ' disabled' : ''}>${ms.map(m => `<option value="${pad(m)}"${m === M ? ' selected' : ''}>${pad(m)}</option>`).join('')}</select></span>`;
    };
    const s0 = v ? tmin(v.a) : otStart(slot);
    const quick = isTr ? [[wa, Math.min(wa + 60, wb)], [Math.max(wb - 60, wa), wb], [wa, wb]].filter((q, i, arr) => q[1] > q[0] && arr.findIndex(z => z[0] === q[0] && z[1] === q[1]) === i) : [60, 120, 180, 240, 300].map(d => [s0, s0 + d]).filter(q => q[1] <= 1439);
    const qchips = quick.map(([x, y]) => `<button type="button" class="hc${v && tmin(v.a) === x && tmin(v.b) === y ? ' sel' : ''}" data-act="dotr" data-slot="${slot}" data-a="${hhmm(x)}" data-b="${hhmm(y)}"${ro ? ' disabled' : ''}>${isTr ? hhmm(x) + '–' + hhmm(y) : 'đến ' + hhmm(y)}</button>`).join('');
    const dis = ro || !v;
    return sec(slot, title, frame, v && !ro ? `<button type="button" class="lnk" data-act="dotclear" data-slot="${slot}">Xóa</button>` : '',
      `<div class="ubs">${ubs(slot, v && v.u, 'dotu')}</div>
       <div class="hrs"><span class="gr"><span>Từ</span>${tin('a', dv.a, Math.floor(wa / 60), isTr ? Math.floor(wb / 60) : 23, dis)}<button type="button" class="step" data-act="dots" data-slot="${slot}" data-k="a" data-d="-30" aria-label="Sớm hơn 30 phút"${dis ? ' disabled' : ''}>−</button><button type="button" class="step" data-act="dots" data-slot="${slot}" data-k="a" data-d="30" aria-label="Muộn hơn 30 phút"${dis ? ' disabled' : ''}>+</button></span>
         <span class="gr"><span>đến</span>${tin('b', dv.b, Math.floor(wa / 60), isTr ? Math.floor(wb / 60) : 23, dis)}<button type="button" class="step" data-act="dots" data-slot="${slot}" data-k="b" data-d="-30" aria-label="Sớm hơn 30 phút"${dis ? ' disabled' : ''}>−</button><button type="button" class="step" data-act="dots" data-slot="${slot}" data-k="b" data-d="30" aria-label="Muộn hơn 30 phút"${dis ? ' disabled' : ''}>+</button></span>
         <output class="tot">${v ? fmt(v.h) + ' giờ' : '–'}</output></div><div class="hrs q">${qchips}</div>`);
  };
  const head = `<div class="rn"><button type="button" class="ib" data-act="dnav" data-d="-1" aria-label="Người trước"${idx <= 0 ? ' disabled' : ''}>‹</button>
    <div class="rt"><h2>${esc(w.name)}</h2><small>${WD[wdOf(S.date)]} ${dmy(S.date)}${w.pos ? ' · ' + esc(w.pos) : ''}${w.cat && S.cats[w.cat] ? ' · mặc định ' + esc(catName(w.cat)) : ''}</small></div>
    <button type="button" class="ib" data-act="dnav" data-d="1" aria-label="Người sau"${idx < 0 || idx >= order.length - 1 ? ' disabled' : ''}>›</button></div>`;
  const bodyHtml = `${sec('s', 'Sáng', '0,5 công', '', `<div class="ubs">${ubs('s', r.s, 'dpick')}</div>`)}
    ${sec('c', 'Chiều', '0,5 công', ro ? '' : `<button type="button" class="lnk" data-act="dsame">Giống buổi sáng</button>`, `<div class="ubs">${ubs('c', r.c, 'dpick')}</div>`)}
    ${otSec('tr', 'Tăng ca trưa')}${otSec('t', 'Tăng ca tối')}
    <label class="notef"><span>Ghi chú</span><input id="dlg-note" maxlength="80" value="${esc(r.n)}" placeholder="Ví dụ: về sớm 1 giờ"${ro ? ' disabled' : ''}></label>`;
  const foot = `<span class="sumtxt"><b>${fmt(info.cong)}</b> công${info.ot ? ` · <b>${fmt(info.ot)}</b> giờ tăng ca` : ''}${info.ot > S.settings.otCap ? ' <em class="warnx">quá mức cảnh báo</em>' : ''}</span><button type="button" class="btn pri" data-act="dlg-close">Xong</button>`;
  return shell('row', w.name, bodyHtml, foot, head);
}
A.dnav = el => { flushNote(); const order = displayOrder(S.date), i = order.findIndex(x => x.id === S.dlg.wid), n = order[i + (+el.dataset.d)]; if (n) openRow(n.id, S.dlg.focus); };
function rowEdit(patch) { const wid = S.dlg.wid; flushNote(); const r = getRow(S.date, wid); commit(S.date, { [wid]: { ...r, ...patch } }); renderDlg(); }
A.dpick = el => { const { slot, u } = el.dataset, r = getRow(S.date, S.dlg.wid); S.dlg.focus = slot; rowEdit({ [slot]: r[slot] === u ? null : u }); };
A.dsame = () => { const r = getRow(S.date, S.dlg.wid); rowEdit({ c: r.s }); };
A.dotu = el => { const { slot, u } = el.dataset, r = getRow(S.date, S.dlg.wid), cur = r[slot]; S.dlg.focus = slot; S.dlg.otU = u; rowEdit({ [slot]: cur && cur.u === u ? null : (cur ? { ...cur, u } : otDefault(slot, u)) }); };
const otUnit = (slot, cur) => (cur ? cur.u : S.dlg.otU);
A.dotr = el => { const { slot, a, b } = el.dataset, r = getRow(S.date, S.dlg.wid), u = otUnit(slot, r[slot]); if (!u) return toast('Chọn hạng mục trước.'); S.dlg.focus = slot; rowEdit({ [slot]: otMake(slot, u, tmin(a), tmin(b)) }); };
A.dots = el => {
  const { slot, k } = el.dataset, d = +el.dataset.d, r = getRow(S.date, S.dlg.wid), cur = r[slot]; if (!cur) return;
  const [wa, wb] = otWin(slot); let a = tmin(cur.a), b = tmin(cur.b);
  if (k === 'a') a += d; else b += d;
  if (a < wa) return toast(`Tăng ca bắt đầu sớm nhất lúc ${hhmm(wa)}.`);
  if (b <= a) return toast('Giờ kết thúc phải sau giờ bắt đầu.');
  if (b > wb) return toast(slot === 'tr' ? `Tăng ca trưa chỉ đến ${hhmm(wb)}.` : 'Tăng ca tối chỉ tính đến 23:59.');
  S.dlg.focus = slot; rowEdit({ [slot]: otMake(slot, cur.u, a, b) });
};
C.otime = el => {
  const { slot, k } = el.dataset, r = getRow(S.date, S.dlg.wid), cur = r[slot], u = otUnit(slot, cur);
  if (!u) { toast('Chọn hạng mục trước.'); return renderDlg(); }
  const wrap = el.closest('.tmw'), [wa, wb] = otWin(slot), m = tmin(wrap.querySelector('[data-p=h]').value + ':' + wrap.querySelector('[data-p=m]').value);
  let a = cur ? tmin(cur.a) : wa, b = cur ? tmin(cur.b) : wa + 60;
  if (m == null) return renderDlg();
  if (k === 'a') a = m; else b = m;
  if (a < wa || (slot === 'tr' && b > wb) || b <= a) { toast(slot === 'tr' ? `Tăng ca trưa phải nằm trong ${hhmm(wa)}–${hhmm(wb)}, giờ kết thúc sau giờ bắt đầu.` : a < wa ? `Tăng ca tối bắt đầu sớm nhất lúc ${hhmm(wa)}.` : 'Giờ kết thúc phải sau giờ bắt đầu.'); return renderDlg(); }
  S.dlg.focus = slot; rowEdit({ [slot]: otMake(slot, u, a, b) });
};
A.dotclear = el => { S.dlg.focus = el.dataset.slot; rowEdit({ [el.dataset.slot]: null }); };

/* ---- điền nhanh ---- */
DLG.fill = () => shell('', 'Điền nhanh', `
  <div class="opt"><div><b>Điền theo hạng mục mặc định</b><p>Gán cả sáng và chiều theo hạng mục mặc định của từng người. Chỉ điền người chưa nhập gì.</p></div><button type="button" class="btn pri" data-act="fill-default">Điền</button></div>
  <div class="opt"><div><b>Sao chép từ ngày khác</b><p>Chép Sáng và Chiều (không chép tăng ca) cho người chưa nhập.</p><input type="date" id="copy-from" value="${addDays(S.date, -1)}" aria-label="Sao chép từ ngày"></div><button type="button" class="btn" data-act="fill-copy">Sao chép</button></div>
  <div class="opt"><div><b>Cả công trường nghỉ</b><p>Đánh dấu Nghỉ cả sáng và chiều cho người chưa nhập (mưa bão, Chủ nhật, nghỉ lễ).</p></div><button type="button" class="btn" data-act="fill-off">Đánh dấu nghỉ</button></div>
  <div class="opt"><div><b>Xóa trắng ngày này</b><p>Xóa mọi buổi, tăng ca và ghi chú của ngày ${dmy(S.date)}. Hoàn tác được ngay sau đó.</p></div><button type="button" class="btn ${S.dlg.confirmClear ? 'danger' : ''}" data-act="fill-clear">${S.dlg.confirmClear ? 'Bấm lần nữa để xóa' : 'Xóa trắng'}</button></div>`, '');
A.fillmenu = () => dlgOpen({ type: 'fill' });
const pendingW = () => workersFor(S.date).filter(w => { const r = getRow(S.date, w.id); return r.s == null && r.c == null; });
A['fill-default'] = () => {
  const ch = {};
  pendingW().forEach(w => { if (w.cat && S.cats[w.cat] && S.cats[w.cat].active !== false && workerActive(w, S.date)) ch[w.id] = { ...getRow(S.date, w.id), s: w.cat, c: w.cat }; });
  const n = Object.keys(ch).length; commit(S.date, ch); closeDlg(); toast(n ? `Đã điền ${n} người theo hạng mục mặc định.` : 'Không có ai cần điền thêm.', { undo: n > 0 });
};
A['fill-copy'] = async () => {
  const from = ($('#copy-from') || {}).value;
  if (!isDate(from) || from === S.date) { toast('Chọn một ngày khác để sao chép.'); return; }
  try { await S.fb.watchMonth(monthOf(from)); pull(['days']); } catch (e) { /* offline */ }
  const ch = {};
  pendingW().forEach(w => { const src = getRow(from, w.id), s = isU(src.s) ? src.s : null, c = isU(src.c) ? src.c : null; if (s || c) ch[w.id] = { ...getRow(S.date, w.id), s, c }; });
  const n = Object.keys(ch).length; commit(S.date, ch); closeDlg(); toast(n ? `Đã sao chép ${n} người từ ngày ${dmy(from)}.` : `Ngày ${dmy(from)} chưa có dữ liệu để chép.`, { undo: n > 0 });
};
A['fill-off'] = () => { const ch = {}; pendingW().forEach(w => { ch[w.id] = { ...getRow(S.date, w.id), s: 'X', c: 'X' }; }); const n = Object.keys(ch).length; commit(S.date, ch); closeDlg(); toast(n ? `Đã đánh dấu nghỉ ${n} người.` : 'Không có ai cần đánh dấu.', { undo: n > 0 }); };
A['fill-clear'] = () => {
  if (!S.dlg.confirmClear) { S.dlg.confirmClear = true; renderDlg(); return; }
  const ch = {}; workersFor(S.date).forEach(w => { ch[w.id] = { s: null, c: null, tr: null, t: null, n: '' }; });
  commit(S.date, ch); closeDlg(); toast('Đã xóa trắng ngày ' + dmy(S.date) + '.', { undo: true });
};

/* ================= sự kiện ================= */
document.addEventListener('click', e => {
  const ov = e.target.closest('.ov');
  if (ov && e.target === ov) { closeDlg(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = A[el.dataset.act];
  if (f) f(el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (!el) return; const f = C[el.dataset.chg]; if (f) f(el, e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.dlg) closeDlg(); else if (S.brush) { S.brush = null; render(); } } });
window.addEventListener('hashchange', () => { const t = S.tab; readHash(); if (t !== S.tab) render(); });
window.addEventListener('resize', fixBar);
window.addEventListener('beforeunload', e => { if (busyQ()) { e.preventDefault(); e.returnValue = ''; } });

/* ================= khởi động ================= */
async function boot() {
  const logo = $('#logo'); if (logo) logo.src = 'data:image/png;base64,' + ASSET.lockup.png;
  render();
  if (!(await appBoot())) return;
  readHash(); render();
}
boot();

if (typeof window !== "undefined" && window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.testHook) window.__ccm = { S, catReport, divisor, render };

})();
</script>
<script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(function(){});</script>
