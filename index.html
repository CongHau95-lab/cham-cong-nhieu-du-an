<style>
/* Layout idea: navy header band carrying the Central mark; a sticky date + brush palette bar; one card per worker with four slot buttons (sáng, chiều, tăng ca trưa, tăng ca tối). Orange marks what is active. */
:root {
  --bg: #eef0f5; --surface: #ffffff; --surface2: #f5f6fa; --ink: #151c33; --muted: #5b6480;
  --line: #d4d9e6; --line2: #e5e8f0;
  --navy: #233064; --pop: #ee4f27;
  --accent: #233064; --on-accent: #ffffff; --head: #233064; --on-head: #ffffff;
  --ok: #1b8a4c; --warn: #b3600a; --bad: #c2342b; --okbg: #e2f4ea; --warnbg: #fdf0dc; --badbg: #fbe5e2;
  --u-bg-s: 72%; --u-bg-l: 90%; --u-fg-s: 65%; --u-fg-l: 24%; --u-bd-s: 45%; --u-bd-l: 62%; --u-sel-l: 36%;
  --f-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-disp: 'Barlow Condensed', 'Arial Narrow', 'Be Vietnam Pro', system-ui, sans-serif;
  --barh: 0px; --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1424; --surface: #171f36; --surface2: #1c2540; --ink: #e8ecf8; --muted: #9aa5c4;
    --line: #2d3858; --line2: #243050; --accent: #a9b9ff; --on-accent: #0b1330; --head: #0a1022; --on-head: #ffffff;
    --pop: #ff6a42; --ok: #5ccf8d; --warn: #f0a85a; --bad: #ff8d80; --okbg: #14301f; --warnbg: #352612; --badbg: #3a1a18;
    --u-bg-s: 34%; --u-bg-l: 25%; --u-fg-s: 85%; --u-fg-l: 86%; --u-bd-s: 38%; --u-bd-l: 46%; --u-sel-l: 44%;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1424; --surface: #171f36; --surface2: #1c2540; --ink: #e8ecf8; --muted: #9aa5c4;
  --line: #2d3858; --line2: #243050; --accent: #a9b9ff; --on-accent: #0b1330; --head: #0a1022; --on-head: #ffffff;
  --pop: #ff6a42; --ok: #5ccf8d; --warn: #f0a85a; --bad: #ff8d80; --okbg: #14301f; --warnbg: #352612; --badbg: #3a1a18;
  --u-bg-s: 34%; --u-bg-l: 25%; --u-fg-s: 85%; --u-fg-l: 86%; --u-bd-s: 38%; --u-bd-l: 46%; --u-sel-l: 44%;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); -webkit-text-size-adjust: 100%; }
body { min-height: 100%; padding-bottom: env(safe-area-inset-bottom); }
body.modal { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
small { font-size: 11.5px; color: var(--muted); }
.muted { color: var(--muted); }
.grow { flex: 1; }
.pad { padding: 10px 14px; }
.hs { }

/* unit colours: one hue per unit, lightness set per theme */
.u { --ub: hsl(var(--h) var(--u-bg-s) var(--u-bg-l)); --uf: hsl(var(--h) var(--u-fg-s) var(--u-fg-l)); --ubd: hsl(var(--h) var(--u-bd-s) var(--u-bd-l)); --usel: hsl(var(--h) 58% var(--u-sel-l)); }

/* ---------- header ---------- */
.top { background: var(--head); color: var(--on-head); padding-top: env(safe-area-inset-top); border-bottom: 4px solid var(--pop); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right)) 4px max(16px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 12px; }
.logo-badge { flex: none; display: flex; align-items: center; padding: 2px 0; }
.logo { display: block; height: 38px; width: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.brand { min-width: 0; flex: 1; }
.brand p { font-size: 13px; font-weight: 600; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { border: 0; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; white-space: nowrap; background: rgba(255,255,255,.14); color: #fff; }
.pill::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: #6be39b; }
.pill.warn::before { background: #ffc15a; }
.pill.bad::before { background: #ff8a7a; }
.tabs { max-width: 1280px; margin: 0 auto; padding: 0 max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left)); display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; background: none; border: 0; color: rgba(255,255,255,.72); padding: 11px 14px 9px; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab .ts { display: none; }
.tab.on { color: #fff; border-bottom-color: var(--pop); }
main { max-width: 1280px; margin: 0 auto; padding: 0 max(12px, env(safe-area-inset-right)) 90px max(12px, env(safe-area-inset-left)); }

/* ---------- buttons ---------- */
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; min-height: 38px; white-space: nowrap; }
.btn.ghost { background: transparent; }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.sm { padding: 4px 11px; min-height: 30px; font-size: 13px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.ib { width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; display: inline-grid; place-items: center; flex: none; }
.lnk { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- sticky bar ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 10px 0 8px; border-bottom: 1px solid var(--line); margin: 0 -12px; padding-left: 12px; padding-right: 12px; }
.bar.flat { position: static; border: 0; }
.datebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dsel { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 0 12px; min-height: 38px; }
.dsel input { border: 0; background: transparent; font-weight: 700; font-size: 15px; padding: 6px 0; width: 138px; }
.wd { font: 600 17px var(--f-disp); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
.wd.sun { color: var(--pop); }
.palette { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.chip { white-space: nowrap; display: inline-flex; align-items: baseline; gap: 6px; min-height: 36px; padding: 5px 13px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); }
.chip b { font: 700 15px var(--f-disp); letter-spacing: .04em; }
.chip i { font: normal 700 12px var(--f-body); opacity: .85; }
.chip.u { background: var(--ub); color: var(--uf); border-color: var(--ubd); }
.chip.static { min-height: 0; padding: 1px 10px; cursor: default; }
.chip.off { background: repeating-linear-gradient(135deg, var(--surface2) 0 5px, var(--line2) 5px 10px); color: var(--muted); }
.chip.on { background: var(--usel); color: #fff; border-color: var(--usel); box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--pop); }
.chip.off.on { background: var(--muted); color: #fff; border-color: var(--muted); }
.hint { margin-top: 9px; font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.hint.on { color: var(--ink); background: var(--warnbg); border-left: 4px solid var(--pop); padding: 6px 10px; border-radius: 8px; }
.stats { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 10px 2px 8px; font-size: 13px; }
.st b { font: 700 18px var(--f-disp); }
.st.warn, .warnx { color: var(--warn); font-weight: 700; }
.tg { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 600; }
.tg.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ---------- daily list ---------- */
.colhead, .r { display: grid; grid-template-columns: minmax(180px, 1.5fr) repeat(4, minmax(92px, 1fr)) 84px; gap: 6px; align-items: center; }
.colhead { position: sticky; top: var(--barh); z-index: 15; background: var(--bg); padding: 6px 12px 6px 16px; font: 600 12px var(--f-body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line2); margin: 0 -12px; padding-left: 28px; padding-right: 24px; }
.colhead span { text-align: center; } .colhead span:first-child { text-align: left; }
.gh { display: flex; align-items: baseline; gap: 12px; padding: 14px 4px 6px; flex-wrap: wrap; }
.gh b { font: 700 17px var(--f-disp); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.gtools { margin-left: auto; display: flex; gap: 6px; align-items: center; font-size: 12px; }
.gtools button { background: var(--pop); color: #fff; border: 0; border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 12px; }
.r { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: var(--r); padding: 6px 10px 6px 10px; margin-bottom: 6px; }
.r.st-ok { border-left-color: var(--ok); }
.r.st-part { border-left-color: var(--warn); background: linear-gradient(90deg, var(--warnbg), var(--surface) 22%); }
.r.st-none { border-left-color: var(--line); }
.dot { display: none; }
.nm { background: none; border: 0; text-align: left; padding: 4px 0; min-width: 0; }
.nmt { display: block; min-width: 0; }
.nmt b { display: block; font-weight: 600; font-size: 15px; line-height: 1.25; }
.nmt small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 48px; padding: 3px 4px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); line-height: 1.15; min-width: 0; }
.cell b { font: 700 16px var(--f-disp); letter-spacing: .04em; }
.cell i { font: normal 700 12px var(--f-body); }

.rtg { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface2); color: var(--muted); } .rtg.ex, .rtg.ok { background: var(--okbg); color: var(--ok); } .rtg.mid { background: var(--warnbg); color: var(--warn); } .rtg.bad { background: var(--badbg); color: var(--bad); }
.lt tr.wv td { opacity: .65; }
.how { padding: 10px 14px 14px; font-size: 13px; } .how summary { cursor: pointer; font-weight: 700; } .how ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.dcsum { display: grid; gap: 4px; font-size: 14px; }
.pad { padding: 10px 14px; }
.rtg { white-space: nowrap; } .att td { white-space: nowrap; } .att td:nth-child(2) { white-space: normal; min-width: 170px; } .att td small { white-space: normal; }

/* báo cáo ảnh */
.frm .lbl { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.repv { background: #0a1d38; border-radius: 10px; min-height: 120px; display: grid; place-items: center; overflow: hidden; transition: opacity .15s; }
.repv img { width: 100%; height: auto; display: block; }
.repv p { margin: 0; padding: 36px 16px; color: #d5e1f4; text-align: center; }
.repv.busy { opacity: .55; }

/* ---- nhà sáng tạo ---- */
.credit { max-width: 1280px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); text-align: right; font-size: 12px; color: var(--muted, #6b7280); }
.credit b { color: var(--ink, #1f2a44); font-weight: 600; }
.credit a { color: inherit; text-decoration: none; font-weight: 600; }
.credit .live { font-weight: 600; white-space: nowrap; }
.credit .live.on { color: #15803d; }
.credit .live.off { color: var(--muted, #6b7280); }
@media print { .credit { display: none; } }

/* ---- chế độ app: tài khoản, phân quyền, góp ý ---- */
.pill.acct { display: inline-flex; align-items: center; gap: 6px; max-width: 46vw; cursor: pointer; }
.pill.acct::before { display: none; }
.pill.acct .an { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 24vw; }
.rb { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; background: var(--surface2); color: var(--ink); border: 1px solid var(--line); white-space: nowrap; }
.rb.r-owner { background: #fff1cc; color: #7a5200; border-color: #f0cf7a; }
.rb.r-editor { background: #dfe8ff; color: #1d3a8a; border-color: #b8c9f5; }
.rb.r-commenter { background: #e3f6ea; color: #13663a; border-color: #b6e2c6; }
.rb.r-viewer { background: #efe7fb; color: #4c2a85; border-color: #d3c3ee; }
.rb.r-pending, .rb.r-guest { background: var(--surface2); color: var(--muted); }
.rb.r-ok { background: #e3f6ea; color: #13663a; border-color: #b6e2c6; }
.rb.r-warn { background: #fff1cc; color: #7a5200; border-color: #f0cf7a; }
.pill.acct .rb { border-color: transparent; }
.bdg { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 999px; background: var(--bad, #d64b3c); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
.abar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; margin: 10px 12px 0; padding: 10px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--warn, #e0a030); font-size: 14px; }
.acrow { display: grid; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--line2, var(--line)); }
.acrow small { color: var(--muted); }
.brow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sglist { display: grid; gap: 10px; padding: 4px 14px 14px; }
.sg { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; background: var(--surface); }
.sg.done { opacity: .78; }
.sgh { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sgh small { color: var(--muted); }
.sgt, .sgr { margin: 0; line-height: 1.5; }
.sgr { padding: 8px 10px; border-radius: 8px; background: var(--surface2); }
.sgc { display: grid; gap: 8px; }
.sgc textarea { width: 100%; }
.rolelist { list-style: none; margin: 0; padding: 10px 14px 14px; display: grid; gap: 8px; font-size: 13px; }
.rolelist li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.bklist { margin: 0; padding-left: 20px; display: grid; gap: 2px; }
/* lập danh sách tùy chọn */
.plist .clh { display: none !important; }
.clq { width: 100%; margin: 2px 0 8px; }
.clchips { align-items: center; margin-bottom: 8px; }
.clchips .tg small { opacity: .7; }
.clcols { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

/* ===== bổ sung cho bản nhiều dự án ===== */
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 12px 14px 16px; }
.pcard { border: 1.5px solid var(--line); border-left: 5px solid var(--pop); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; background: var(--surface); }
.pcard.off { border-left-color: var(--line); background: var(--surface2); }
.pch { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; } .pch b { font: 700 19px var(--f-disp); letter-spacing: .02em; } .pch small { color: var(--muted); }
.pcs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .pcs small { color: var(--muted); }
.num { text-align: right !important; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lt.pay th, .lt.pay td { padding: 7px 8px; } .lt.pay td:nth-child(2) { text-align: left; }
.lt tfoot td { background: var(--surface2); border-bottom: 0; }
.lt td input, .lt td select { width: 100%; min-width: 90px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; min-height: 36px; font: inherit; }
.lt.wg td input[type=date] { min-width: 130px; }
.frmh { margin: 14px 0 4px; font: 700 15px var(--f-disp); letter-spacing: .03em; } .frmh small { font: 400 12px var(--f-body); color: var(--muted); letter-spacing: 0; }
.frm.cols .frmh, .frm.cols .wide { grid-column: 1 / -1; }
.hues { display: flex; gap: 10px; flex-wrap: wrap; padding: 6px 0; }
.dcard span { display: block; color: var(--muted); font-size: 12px; }
.dcard b { font: 700 22px var(--f-disp); }
.dcard { border-left-color: var(--pop) !important; }
.notice .brow { margin-top: 10px; }
.lt tr.wv td { opacity: .65; }

const pad = n => String(n).padStart(2, '0');

const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const dmy = s => { const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };

  function signOut() { closeProject(); sess = null; me = null; saveSess(); on.auth(); }
  const resetPassword = email => authCall('sendOobCode', { requestType: 'PASSWORD_RESET', email });
  const resendVerify = () => authCall('sendOobCode', { requestType: 'VERIFY_EMAIL', idToken: sess.idToken });
  async function refreshVerify() {

  let lastMeAt = 0;

  }

  /* ---------- Firestore ---------- */
  const REQ = { fieldPath: '_ts', setToServerValue: 'REQUEST_TIME' };

  const wSet = (path, data, ts = true) => ({ update: { name: dn(path), fields: fsFields(data) }, ...(ts ? { updateTransforms: [REQ] } : {}) });
  const wMask = (path, data, ts = true) => ({ update: { name: dn(path), fields: fsFields(data) }, updateMask: { fieldPaths: Object.keys(data).map(fsPath) }, ...(ts ? { updateTransforms: [REQ] } : {}) });
  /** cập nhật lồng nhau một cấp: {rows: {w1: {...}}} chỉ ghi đúng phần của w1, không đè phần của người khác */

  const pp = (col, id) => `projects/${pid}/${col}/${id}`;
  async function commit(writes, bump) {

  }
  const parseDoc = j => {
    const f = j.fields || {}, data = {};

  };
  async function getDoc(path) {
    try { return parseDoc(await http('GET', `${FS}/${path}`)); }

  }
  const flt = (field, op, value) => ({ fieldFilter: { field: { fieldPath: field }, op, value } });
  /** parent: '' (gốc) hoặc 'projects/xyz' */

  }

  /* ---------- tài khoản và dự án (cấp gốc) ---------- */
  async function projectsList() {
    if (!me) return [];
    if (me.role === 'owner') { const r = await query('', 'projects'); return r.docs.filter(d => !d.del).map(d => ({ id: d.id, ...d.data })); }
    if (!me.projectId) return [];
    const d = await getDoc('projects/' + me.projectId);
    return d && !d.del ? [{ id: d.id, ...d.data }] : [];
  }
  async function projectSave(id, data) { await commit([wSet('projects/' + id, data)], false); }
  async function projectPatch(id, patch) { await commit([wMask('projects/' + id, patch)], false); }
  const PROJECT_COLS = ['cats', 'workers', 'wpriv', 'days', 'config', 'cpriv', 'sug', 'meta'];
  async function projectRemove(id) {
    for (const col of PROJECT_COLS) {
      const r = await query('projects/' + id, col);
      for (let i = 0; i < r.docs.length; i += 100) {
        await http('POST', `${FS}:commit`, { writes: r.docs.slice(i, i + 100).map(d => ({ delete: dn(`projects/${id}/${col}/${d.id}`) })) });
      }
    }
    await http('POST', `${FS}:commit`, { writes: [{ delete: dn('projects/' + id) }] });
  }
  async function usersList() {
    const r = await query('', 'users');
    return r.docs.filter(d => !d.del).map(d => ({ uid: d.id, ...d.data })).sort((a, b) => ((b.role === 'owner') - (a.role === 'owner')) || String(a.email).localeCompare(String(b.email)));
  }
  const userPatch = (uid, patch) => commit([wMask('users/' + uid, patch, false)], false);
  async function transferOwner(heirUid, keepPid) {
    await commit([wMask('admin/owner', { uid: heirUid }, false)], false);   // khi còn là Chủ
    await userPatch(heirUid, { role: 'owner' });
    await userPatch(sess.uid, { role: 'member', projectId: keepPid || '', access: 'editor', seePay: true });
    await loadMe();
  }
  /** người đầu tiên: nhận quyền Chủ khi hệ thống chưa có Chủ */
  async function ownerExists() { try { return !!(await getDoc('admin/owner')); } catch (e) { return true; } }
  async function claimOwner() {
    await commit([wSet('admin/owner', { uid: sess.uid }, false)], false);
    await userPatch(sess.uid, { role: 'owner' });
    await loadMe();
  }

  /* ---------- dữ liệu một dự án: bộ nhớ đệm ---------- */
  const store = { cats: {}, workers: {}, wpriv: {}, days: {}, config: {}, cpriv: {}, sug: {} };
  const cursor = {}, fresh = {}, denied = {}, monthWatch = {}, inflight = {};
  const live = d => d && !d.del;
  const tsMs = s => (s ? Date.parse(s) : 0);
  const canPriv = () => !!me && (me.role === 'owner' || me.seePay);
  const canEdit = () => !!me && (me.role === 'owner' || me.access === 'editor');
  const once = (key, fn) => inflight[key] || (inflight[key] = fn().finally(() => { delete inflight[key]; }));
  function put(col, d) {
    const old = store[col][d.id];
    if (old && old.ts && d.ts && tsMs(d.ts) < tsMs(old.ts)) return false;
    store[col][d.id] = d; return true;
  }
  const FULL = () => ['cats', 'workers', 'config'].concat(canPriv() ? ['wpriv', 'cpriv'] : []);
  const loadFull = (col, force) => once('f:' + col, async () => {
    if (denied[col] || (fresh[col] && !force)) return;
    try {
      const r = await query('projects/' + pid, col), keep = {};
      r.docs.forEach(d => { put(col, d); keep[d.id] = 1; });
      for (const id in store[col]) if (!keep[id] && !store[col][id].local) delete store[col][id];
      cursor[col] = r.readMs; fresh[col] = true;
    } catch (e) {
      if (e.code === 'permission-denied' && (col === 'wpriv' || col === 'cpriv')) { denied[col] = true; return; }

    }
  });
  const loadMonth = (ym, force) => once('m:' + ym, async () => {
    if (fresh['days:' + ym] && !force) return;
    const r = await query('projects/' + pid, 'days', flt('month', 'EQUAL', { stringValue: ym })), keep = {};
    r.docs.forEach(d => { put('days', d); keep[d.id] = 1; });

  async function sync() {
    const changed = new Set();

    for (const col of cols) {
      if (!cursor[col] || denied[col]) continue;

      const r = await query('projects/' + pid, col, flt('_ts', 'GREATER_THAN_OR_EQUAL', { timestampValue: since }));

  async function openProject(id) {

  async function watchMonth(ym) {

  }

  /* ---------- vòng hỏi + kênh đẩy ---------- */
  let timer = 0, busy = false, down = false, lastRev = null, started = false;
  let stream = null, streamOk = false, streamRetry = 0, backoff = 2000, lastPush, lastOwn = 0, lastKick = 0, kickT = 0, pendingKick = false, tickErr = null;

  async function pushRev() {

      await ensureToken();

      await fetch(`${RT}/rev/${encodeURIComponent(pid)}.json?auth=${encodeURIComponent(sess.idToken)}`, { method: 'PUT', body: JSON.stringify(v) });

  }

  function onPush(ev, raw) {

  async function getRev() {
    try { const j = await http('GET', `${FS}/projects/${pid}/meta/rev`); return j.updateTime || ''; }

  }

  /* ---------- ghi dữ liệu dự án (cập nhật bản đệm ngay, rồi gửi đi) ---------- */

  /** ghi cả tài liệu */

  }

  }
  async function delDoc(col, id) {
    await commit([wSet(pp(col, id), { _del: true })], true);

  }
  /** lưu công nhân: phần công khai luôn ghi; phần riêng chỉ ghi khi được quyền xem lương */
  async function setWorker(id, data) {

    if (canPriv()) ws.push(wSet(pp('wpriv', id), pri));

  }

  /* ---------- góp ý ---------- */
  const sugList = () => Object.keys(store.sug).filter(id => live(store.sug[id])).map(id => ({ id, ...store.sug[id].data })).sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
  async function sugLoad() {
    if (!sess || !pid) return [];

    const keep = {};
    r.docs.forEach(d => { put('sug', d); keep[d.id] = 1; });

  }
  async function sugAdd(s) {
    const id = 'g' + uid8(), data = { uid: sess.uid, name: me.name, email: me.email, status: 'open', reply: '', ...s, createdAt: new Date().toISOString() };
    await commit([wSet(pp('sug', id), data)], false);
    store.sug[id] = { id, data, ts: null, local: true };
  }
  async function sugUpdate(id, patch) {
    await commit([wMask(pp('sug', id), patch)], false);
    const old = store.sug[id]; store.sug[id] = { id, data: { ...(old ? old.data : {}), ...patch }, ts: null, local: true };
  }

  /* ---------- khởi động ---------- */
  async function init() {
    try { const s = JSON.parse(localStorage.getItem(LS_AUTH) || 'null'); if (s && s.refreshToken) sess = s; } catch (e) { sess = null; }

  }
  return {
    on, init, signIn, signUp, signOut, resetPassword, resendVerify, refreshVerify, loadMe,
    get me() { return me; }, get pid() { return pid; }, get signedIn() { return !!sess; }, get live() { return streamOk; }, get hasRT() { return !!RT; },

  };
}

/* ================= tài khoản, dự án, phân quyền ================= */
const roleBadge = r => `<span class="rb r-${esc(r)}">${esc(ROLE_VI[r] || r)}</span>`;
const myRoleKey = () => S.isOwner ? 'owner' : (S.me && S.me.projectId ? S.me.access : 'pending');

/** tính quyền từ hồ sơ tài khoản + dự án đang mở */
function applyMe() {
  const m = S.fb.me; S.me = m;
  const owner = !!m && m.role === 'owner' && m.verified;
  const ok = !!m && m.verified && (owner || !!m.projectId);
  const stopped = !!(S.project && S.project.status === 'stopped');
  S.isOwner = owner;
  S.canWrite = owner || (ok && m.access === 'editor' && !stopped);
  S.canComment = owner || (ok && (m.access === 'editor' || m.access === 'commenter'));
  S.canPrivate = owner || (ok && m.seePay);
  if (!visibleTab(S.tab)) S.tab = 'nhap';
}
async function loadProjects() {
  const list = await S.fb.projectsList();
  S.projects = {}; list.forEach(p => { S.projects[p.id] = p; });
}
async function enterProject(id) {
  S.pid = id; S.project = S.projects[id] || null;
  S.loaded = false; S.days = {}; S.overlay = {}; S.undo = []; S.cats = {}; S.workers = {};
  S.settings = { ...DEFAULT_SETTINGS }; S.pay = { ...DEFAULT_PAY };
  applyMe(); render();
  try { await S.fb.openProject(id); pull(); S.loaded = true; S.stale = false; }
  catch (e) { S.stale = true; S.loadErr = authErr(e); }
  if (S.firstEnter !== false) { S.firstEnter = false; readHash(); } else { S.tab = 'nhap'; try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ } }
  applyMe(); render();
}
function leaveProject() {
  S.fb.closeProject(); S.pid = null; S.project = null; S.loaded = false;
  S.cats = {}; S.workers = {}; S.days = {}; S.overlay = {}; S.tab = 'nhap';
  applyMe(); render();
}
/** sau đăng nhập hoặc khi quyền thay đổi: chọn màn hình phù hợp */
async function route() {
  applyMe();
  if (!S.me || !S.me.verified) { S.fb.closeProject(); S.pid = null; render(); return; }
  try { await loadProjects(); } catch (e) { S.stale = true; }
  if (S.isOwner) {
    if (S.pid && !S.projects[S.pid]) { S.pid = null; S.fb.closeProject(); }
    if (!S.pid && Object.keys(S.projects).length === 1 && S.autoOpen !== false) { await enterProject(Object.keys(S.projects)[0]); return; }
    render(); return;
  }
  if (S.me.projectId && S.projects[S.me.projectId]) { if (S.pid !== S.me.projectId) await enterProject(S.me.projectId); else { S.project = S.projects[S.pid]; applyMe(); render(); } return; }
  S.pid = null; S.fb.closeProject(); render();
}

async function appBoot() {
  if (ART) {
    S.fb = await makeFbArt();
    if (!S.fb) { S.conn = 'noart'; render(); return false; }
  } else {
    const cfg = window.FIREBASE_CONFIG;
    if (!cfg || !cfg.apiKey || !cfg.projectId || /DIEN-|YOUR_|^\.\.\./i.test(cfg.apiKey + cfg.projectId)) { S.conn = 'setup'; render(); return false; }
    S.fb = makeFb(cfg);
  }
  S.cfgOk = true;
  S.fb.on.change = cols => { pull(cols); renderSoon(); };
  S.fb.on.live = () => renderLive();
  S.fb.on.auth = () => { const was = S.pid, m = S.fb.me; applyMe(); if (m && m.verified) { if (!S.pid || (!S.isOwner && m.projectId !== S.pid)) route(); else { if (S.projects[S.pid]) S.project = S.projects[S.pid]; renderSoon(); } } else renderSoon(); void was; };
  S.fb.on.error = e => { S.stale = !!e; renderSoon(); };
  S.fb.on.projects = async () => {   // bản artifact: danh sách dự án đổi (máy khác thêm, sửa, xóa)
    if (!S.me) return;
    try { await loadProjects(); } catch (e) { return; }
    if (S.pid && !S.projects[S.pid]) { if (S.isOwner || !S.me.projectId) { leaveProject(); return; } }
    if (S.pid) S.project = S.projects[S.pid] || S.project;
    applyMe(); renderSoon();
  };
  await S.fb.init();
  S.conn = 'ok';
  if (S.fb.me && S.fb.me.role === 'member' && !S.fb.me.projectId) S.ownerFree = !(await S.fb.ownerExists());
  await route();
  return true;
}

function authErr(e) {
  const m = String((e && e.message) || '');
  if (/EMAIL_EXISTS/.test(m)) return 'Email này đã có tài khoản. Hãy chuyển sang Đăng nhập.';
  if (/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m)) return 'Email hoặc mật khẩu chưa đúng.';
  if (/WEAK_PASSWORD/.test(m)) return 'Mật khẩu quá yếu: cần ít nhất 8 ký tự.';
  if (/INVALID_EMAIL|MISSING_EMAIL/.test(m)) return 'Email chưa hợp lệ.';
  if (/TOO_MANY_ATTEMPTS/.test(m)) return 'Thử quá nhiều lần. Chờ vài phút rồi thử lại.';
  if (/USER_DISABLED/.test(m)) return 'Tài khoản này đã bị khóa.';
  if (/OPERATION_NOT_ALLOWED/.test(m)) return 'Firebase chưa bật đăng nhập bằng Email/Mật khẩu.';
  if (e && e.code === 'unavailable') return 'Không kết nối được mạng.';
  if (e && e.code === 'permission-denied') return 'Máy chủ từ chối. Bạn chưa có quyền làm việc này (hoặc kiểm tra lại Firestore Rules).';
  return 'Không thực hiện được' + (m ? ' (' + m + ')' : '') + '.';
}

/* ================= minimal XLSX writer: ZIP "store" + SpreadsheetML, no external library ================= */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
const utf8 = s => new TextEncoder().encode(s);

function zipStore(files) {
  const out = [], cen = [];
  let off = 0;
  const u16 = v => [v & 255, (v >> 8) & 255], u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  const DT = (46 << 9) | (1 << 5) | 1;   // 2026-01-01 00:00 (DOS date/time)
  for (const f of files) {
    const name = utf8(f.name), data = f.data, crc = crc32(data);
    const lh = Uint8Array.from([0x50, 0x4B, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(DT), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0)]);
    out.push(lh, name, data);
    cen.push(Uint8Array.from([0x50, 0x4B, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(DT), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), name);
    off += lh.length + name.length + data.length;
  }
  const cenLen = cen.reduce((a, c) => a + c.length, 0);
  const end = Uint8Array.from([0x50, 0x4B, 5, 6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cenLen), ...u32(off), ...u16(0)]);
  const all = [...out, ...cen, end];
  const buf = new Uint8Array(all.reduce((a, c) => a + c.length, 0));
  let p = 0; all.forEach(c => { buf.set(c, p); p += c.length; });
  return buf;
}

const IMP_COLS = [['name', 'Họ tên'], ['pos', 'Chức vụ'], ['monthly', 'Lương tháng'], ['bank', 'Ngân hàng'], ['account', 'Số tài khoản'], ['cccd', 'CCCD'], ['start', 'Ngày vào']];
const IMP_KEYS = { name: /^(ho va ten|ho ten|ten|ho va ten cong nhan|cong nhan)$/, pos: /^(chuc vu|vi tri|chuc danh|nghe)/, monthly: /luong/, bank: /ngan hang/, account: /(so tai khoan|stk|tai khoan)/, cccd: /(cccd|can cuoc|cmnd)/, start: /ngay (vao|bat dau)/ };
function parsePaste(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (!lines.length) return { rows: [], map: [] };
  const split = l => l.includes('\t') ? l.split('\t') : l.split(/;|,(?=\S)/);
  const cells = lines.map(split).map(a => a.map(x => x.trim()));
  let map = IMP_COLS.slice(0, Math.min(3, cells[0].length)).map(c => c[0]), start = 0;
  const hdr = cells[0].map(x => fold(x));
  const found = hdr.map(h => Object.keys(IMP_KEYS).find(k => IMP_KEYS[k].test(h)) || '');
  if (found.includes('name')) { map = found; start = 1; }
  const rows = cells.slice(start).map(a => { const o = {}; a.forEach((v, i) => { if (map[i] && v !== '') o[map[i]] = v; }); return o; }).filter(o => o.name);
  return { rows, map };
}

  <div class="opt"><div><b>Sao chép từ ngày khác</b><p>Chép Sáng và Chiều (không chép tăng ca) cho người chưa nhập.</p><input type="date" id="copy-from" value="${addDays(S.date, -1)}" aria-label="Sao chép từ ngày"></div><button type="button" class="btn" data-act="fill-copy">Sao chép</button></div>
  <div class="opt"><div><b>Cả công trường nghỉ</b><p>Đánh dấu Nghỉ cả sáng và chiều cho người chưa nhập (mưa bão, Chủ nhật, nghỉ lễ).</p></div><button type="button" class="btn" data-act="fill-off">Đánh dấu nghỉ</button></div>
  <div class="opt"><div><b>Xóa trắng ngày này</b><p>Xóa mọi buổi, tăng ca và ghi chú của ngày ${dmy(S.date)}. Hoàn tác được ngay sau đó.</p></div><button type="button" class="btn ${S.dlg.confirmClear ? 'danger' : ''}" data-act="fill-clear">${S.dlg.confirmClear ? 'Bấm lần nữa để xóa' : 'Xóa trắng'}</button></div>`, '');
A.fillmenu = () => dlgOpen({ type: 'fill' });
const pendingW = () => workersFor(S.date).filter(w => { const r = getRow(S.date, w.id); return r.s == null && r.c == null; });
A['fill-default'] = () => {
  const ch = {};
  pendingW().forEach(w => { if (w.cat && S.cats[w.cat] && S.cats[w.cat].active !== false && workerActive(w, S.date)) ch[w.id] = { ...getRow(S.date, w.id), s: w.cat, c: w.cat }; });
  const n = Object.keys(ch).length; commit(S.date, ch); closeDlg(); toast(n ? `Đã điền ${n} người theo hạng mục mặc định.` : 'Không có ai cần điền thêm.', { undo: n > 0 });
};
A['fill-copy'] = async () => {
  const from = ($('#copy-from') || {}).value;
  if (!isDate(from) || from === S.date) { toast('Chọn một ngày khác để sao chép.'); return; }
  try { await S.fb.watchMonth(monthOf(from)); pull(['days']); } catch (e) { /* offline */ }
  const ch = {};
  pendingW().forEach(w => { const src = getRow(from, w.id), s = isU(src.s) ? src.s : null, c = isU(src.c) ? src.c : null; if (s || c) ch[w.id] = { ...getRow(S.date, w.id), s, c }; });
  const n = Object.keys(ch).length; commit(S.date, ch); closeDlg(); toast(n ? `Đã sao chép ${n} người từ ngày ${dmy(from)}.` : `Ngày ${dmy(from)} chưa có dữ liệu để chép.`, { undo: n > 0 });
};
A['fill-off'] = () => { const ch = {}; pendingW().forEach(w => { ch[w.id] = { ...getRow(S.date, w.id), s: 'X', c: 'X' }; }); const n = Object.keys(ch).length; commit(S.date, ch); closeDlg(); toast(n ? `Đã đánh dấu nghỉ ${n} người.` : 'Không có ai cần đánh dấu.', { undo: n > 0 }); };
A['fill-clear'] = () => {
  if (!S.dlg.confirmClear) { S.dlg.confirmClear = true; renderDlg(); return; }
  const ch = {}; workersFor(S.date).forEach(w => { ch[w.id] = { s: null, c: null, tr: null, t: null, n: '' }; });
  commit(S.date, ch); closeDlg(); toast('Đã xóa trắng ngày ' + dmy(S.date) + '.', { undo: true });
};

/* ================= sự kiện ================= */
document.addEventListener('click', e => {
  const ov = e.target.closest('.ov');
  if (ov && e.target === ov) { closeDlg(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = A[el.dataset.act];
  if (f) f(el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (!el) return; const f = C[el.dataset.chg]; if (f) f(el, e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.dlg) closeDlg(); else if (S.brush) { S.brush = null; render(); } } });
window.addEventListener('hashchange', () => { const t = S.tab; readHash(); if (t !== S.tab) render(); });
window.addEventListener('resize', fixBar);
window.addEventListener('beforeunload', e => { if (busyQ()) { e.preventDefault(); e.returnValue = ''; } });

/* ================= khởi động ================= */
async function boot() {
  const logo = $('#logo'); if (logo) logo.src = 'data:image/png;base64,' + ASSET.lockup.png;
  render();
  if (!(await appBoot())) return;
  readHash(); render();
}
boot();

})();
</script>
<script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
